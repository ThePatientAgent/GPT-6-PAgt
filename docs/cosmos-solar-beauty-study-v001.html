<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMOS — Solar System Beauty Study</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020612}iframe{width:100%;height:100%;border:0;display:block}#tag{position:fixed;left:12px;bottom:12px;z-index:5;color:#dcecff;background:#061327c9;border:1px solid #6c8ab766;border-radius:12px;padding:8px 11px;font:12px system-ui;pointer-events:none}</style></head>
<body><iframe id="cosmos" title="COSMOS solar system beauty experiment" src="./index.html"></iframe><div id="tag">SOLAR SYSTEM · BEAUTY STUDY / 本番は変更なし</div>
<script>
/* Non-destructive preview. Inject only into the same-origin original tour frame. */
const frame=document.getElementById('cosmos');
frame.addEventListener('load',()=>{
 try{
  const outer=frame.contentDocument;
  const inner=outer&&outer.getElementById('cosmos');
  if(!inner)return;
  const enhance=()=>{
   try{
    const d=inner.contentDocument;
    if(!d||d.getElementById('solar-beauty-study-style'))return;
    const s=d.createElement('style');s.id='solar-beauty-study-style';
    s.textContent=`
    /* Atmospheric and lighting polish: no camera, geometry or timing changes. */
    .solar-earth{filter:drop-shadow(0 0 7px rgba(60,156,250,.35)) saturate(1.13)!important}
    .solar-earth .cosmos-v106-photo{filter:contrast(1.06) saturate(1.12)!important}
    /* Scale the full 440px Sun sprite, not only its gradient layers. */
    /* Keep original photosphere geometry; shrink the whole projected sprite visually. */
    .solar-sun{filter:drop-shadow(0 0 14px rgba(255,174,73,.32))!important;scale:none!important}
    .solar-sun .cosmos-v090-surface{transform:none!important}
    .cosmos-v090-surface{filter:contrast(1.08) saturate(1.10)!important}
    .cosmos-v096-saturn{filter:drop-shadow(0 0 7px rgba(247,208,147,.30)) contrast(1.06)!important}
    .solar-saturn-ring{filter:brightness(1.08)!important}
    @media(prefers-reduced-motion:reduce){.solar-earth,.solar-sun,.cosmos-v096-saturn{filter:none!important}}
    `;
    d.head.appendChild(s);
    /* Avoid transient legacy black-hole frames: override the source synchronously
       before the inner tour loads it, rather than waiting for the outer observer. */
    const hole=d.getElementById('cosmos-hole-visit-frame');
    if(hole&&!hole.dataset.radianceGuard){
      hole.dataset.radianceGuard='1';
      const approved=new URL('./cosmos-black-hole-radiance-v013.html?tour=3',d.baseURI).href;
      const guard=new MutationObserver(()=>{
        const src=hole.getAttribute('src')||'';
        if(src.includes('cosmos-black-hole-tour-extended-v065.html')){
          hole.setAttribute('src',approved);
        }
      });
      guard.observe(hole,{attributes:true,attributeFilter:['src']});
    }
   }catch(e){console.warn('Solar beauty preview unavailable',e)}
  };
  inner.addEventListener('load',enhance);
  enhance();
 }catch(e){console.warn('COSMOS preview unavailable',e)}
});
</script></body></html>
