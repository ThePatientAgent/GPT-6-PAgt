<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020612"><title>COSMOS v091 — Solar Granulation</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020612}iframe{display:block;width:100%;height:100%;border:0}</style></head>
<body><iframe id="cosmos" title="COSMOS interactive universe" allow="fullscreen" src="./cosmos-explorer-v075-earth-moon.html"></iframe>
<script>
/* Isolated visual experiment. Keep v075 and v076 untouched.
   Two independently moving surface layers create parallax on the DOM sphere.
   Animations are compositor transforms where possible; reduced motion respected. */
const css=`
.solar-sun{background:radial-gradient(circle at 46% 43%,rgba(255,252,225,.27),transparent 12%),radial-gradient(circle at 49% 50%,#fff6d5 0%,#f9dfab 6%,#e7ac64 13%,#bc6b38 19%,#713720 23%,transparent 24.5%),radial-gradient(circle at 50% 50%,rgba(255,186,97,.14),rgba(231,123,49,.08) 31%,transparent 65%)!important}
.solar-earth{isolation:isolate;overflow:hidden!important;border-radius:50%!important;
background:radial-gradient(circle at 29% 21%,rgba(159,223,250,.24),transparent 37%),radial-gradient(circle at 40% 40%,#258eb2 0%,#12658d 42%,#073456 77%,#03111f 100%)!important;
box-shadow:inset -18px -8px 24px rgba(0,4,17,.85),inset 5px 5px 11px rgba(184,235,251,.25),0 0 9px rgba(64,148,210,.29)!important}
.solar-earth:before{content:"";position:absolute;inset:-4% -13%;border-radius:50%;
background:linear-gradient(118deg,#819b78 0%,#456e5b 26%,#8e8263 48%,#476d59 68%,#84997a 100%);
clip-path:polygon(12% 13%,22% 9%,32% 15%,38% 25%,34% 34%,43% 39%,39% 48%,45% 55%,35% 63%,31% 80%,25% 71%,24% 58%,15% 48%,18% 34%,12% 23%,12% 13%,49% 18%,62% 13%,76% 23%,88% 34%,81% 43%,74% 50%,65% 55%,60% 45%,54% 42%,48% 30%,49% 18%,67% 72%,82% 69%,91% 77%,79% 87%,68% 83%,67% 72%);
opacity:.82;filter:blur(.55px);transform:translate3d(-5%,0,0) scale(1.06);
animation:cosmos-v077-continental-drift 85s ease-in-out infinite alternate;will-change:transform}
.solar-earth:after{content:"";position:absolute;inset:-7% -12%;border-radius:50%;
background:radial-gradient(ellipse 31% 5% at 31% 28%,rgba(247,252,255,.76),transparent 97%),
radial-gradient(ellipse 34% 6% at 62% 45%,rgba(241,250,255,.65),transparent 97%),
radial-gradient(ellipse 35% 5% at 39% 68%,rgba(250,253,255,.6),transparent 97%),
radial-gradient(ellipse 24% 4% at 72% 76%,rgba(242,250,254,.52),transparent 97%);
opacity:.87;filter:blur(.55px);transform:translate3d(3%,0,0) scale(1.05);
animation:cosmos-v077-cloud-drift 31s ease-in-out infinite alternate;will-change:transform;pointer-events:none}
@keyframes cosmos-v077-continental-drift{0%{transform:translate3d(-7%,0,0) scale(1.06)}100%{transform:translate3d(7%,0,0) scale(1.06)}}
@keyframes cosmos-v077-cloud-drift{0%{transform:translate3d(7%,-1%,0) scale(1.05)}100%{transform:translate3d(-7%,2%,0) scale(1.05)}}
@media(prefers-reduced-motion:reduce){.solar-earth:before,.solar-earth:after{animation:none!important;will-change:auto!important}}

/* v082: quiet, bounded photosphere. No conic gradients or pseudo-elements.
   Original projection remains unchanged; the solar surface is a central disk. */
.solar-sun{animation:none!important;filter:none!important;overflow:visible!important;
background:
radial-gradient(ellipse 8% 6% at 46% 44%,rgba(255,249,201,.29),transparent 95%),
radial-gradient(ellipse 5% 3% at 53% 54%,rgba(135,49,20,.23),transparent 95%),
radial-gradient(ellipse 9% 4% at 48% 57%,rgba(169,65,21,.20),transparent 95%),
radial-gradient(ellipse 4% 8% at 43% 49%,rgba(255,229,136,.22),transparent 95%),
radial-gradient(circle 72px at 50% 50%,#fff3c7 0%,#f8d48b 21%,#f2b55c 46%,#db7c32 70%,#a34c24 88%,#6d301a 99%,transparent 100%),
radial-gradient(circle 91px at 50% 50%,rgba(255,146,51,.12) 0%,rgba(255,113,31,.07) 72%,transparent 100%)!important}
.solar-sun:before,.solar-sun:after{content:none!important;display:none!important}

/* v090: a single animated photosphere canvas, confined to the v082 disk.
   Plasma texture is computed in solar-local coordinates, so it tracks the
   existing 440px sprite projection and its zoom automatically. */
.solar-sun .cosmos-v090-surface{position:absolute;left:148px;top:148px;width:144px;height:144px;border-radius:50%;pointer-events:none;opacity:.87}
@media(prefers-reduced-motion:reduce){.solar-sun .cosmos-v090-surface{opacity:.7}}
`;
document.getElementById('cosmos').addEventListener('load',function(){try{const d=this.contentDocument;if(!d)return;const s=d.createElement('style');s.textContent=css;d.head.appendChild(s);const sun=d.querySelector('.solar-sun');if(sun&&!sun.querySelector('.cosmos-v090-surface')){const cv=d.createElement('canvas');cv.className='cosmos-v090-surface';cv.width=144;cv.height=144;sun.appendChild(cv);const ctx=cv.getContext('2d',{alpha:true});if(ctx){const image=ctx.createImageData(144,144);const pixels=image.data;let last=0;const reduced=d.defaultView.matchMedia('(prefers-reduced-motion: reduce)');function draw(t){if(!cv.isConnected)return;if(t-last>45){last=t;const tm=reduced.matches?0:t*.00065;for(let y=0;y<144;y++){for(let x=0;x<144;x++){const dx=(x-71.5)/71.5,dy=(y-71.5)/71.5,r2=dx*dx+dy*dy,idx=(y*144+x)*4;if(r2>=.98){pixels[idx+3]=0;continue}const z=Math.sqrt(1-r2);const a=Math.sin(dx*26+Math.sin(dy*19+tm*2.3)*1.1+tm*4.2);const b=Math.sin(dy*35-dx*13-tm*5.1);const cc=Math.sin((dx+dy)*57+Math.sin(dx*31-tm*2.8)*1.7+tm*3.7);const fine=Math.sin(dx*91+Math.sin(dy*63+tm*3.1)*1.4-tm*6.3)*Math.sin(dy*87+dx*19+tm*5.6);const turbulence=(a*.23+b*.22+cc*.27+fine*.28);const limb=Math.pow(z,.52);const hot=Math.max(0,turbulence*.85+.5);const dark=Math.max(0,-turbulence*1.3);const edge=Math.min(1,(1-r2)*24);pixels[idx]=Math.min(255,197+49*limb+17*hot-29*dark);pixels[idx+1]=Math.min(255,91+99*limb+63*hot-42*dark);pixels[idx+2]=Math.min(255,31+54*limb+51*hot-19*dark);pixels[idx+3]=Math.round(edge*(.38+.33*limb)*255)}}ctx.putImageData(image,0,0)}d.defaultView.requestAnimationFrame(draw)}d.defaultView.requestAnimationFrame(draw)}}}catch(e){console.error('COSMOS v077 enhancement unavailable',e)}});
</script></body></html>
