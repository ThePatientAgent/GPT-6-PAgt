<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02040d"><title>COSMOS | Black Hole Lab 032 - Radiant Still</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040d;color:#e9ecf6;font:14px system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;pointer-events:none;text-shadow:0 2px 8px #02040d}h1{font-size:17px;letter-spacing:.18em;font-weight:500;margin:0 0 6px}header p{margin:0;color:#b8bbc9;font-size:12px}.tag{position:absolute;right:16px;top:max(22px,env(safe-area-inset-top));color:#b6a1a4;font-size:10px;letter-spacing:.14em}.note{position:absolute;top:max(95px,calc(env(safe-area-inset-top) + 72px));left:20px;max-width:270px;color:#9097ad;font-size:11px;line-height:1.6;pointer-events:none}.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;white-space:nowrap}button{background:#161b2cc4;color:#edf1ff;border:1px solid #73809b77;border-radius:24px;padding:11px 15px;font:inherit;backdrop-filter:blur(9px)}.still{border:1px solid #7d819077;border-radius:20px;padding:10px 14px;font-size:12px;color:#c1c5d2;background:#111827b6}.status{position:absolute;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 65px);width:100%;text-align:center;font-size:11px;color:#9299ad;pointer-events:none}</style>
</head><body><canvas id="c"></canvas><header><h1>COSMOS / BLACK HOLE</h1><p>Radiant still · Accretion &amp; gravitational lensing</p></header><div class="tag">LAB 032</div><div class="note">A high-detail static study: luminous plasma surrounds the black-hole shadow.</div><div class="status" id="status">Rendering the still image…</div><div class="controls"><span class="still">STILL STUDY</span><button id="quality">Detail: High</button><button id="back">COSMOS ↗</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W,H,D,cx,cy,r,quality=1;const TAU=Math.PI*2,rot=-.08,C=Math.cos(rot),S=Math.sin(rot);const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function rnd(n){let a=Math.imul(n|0,0x9E3779B1);a=Math.imul(a^(a>>>16),0x85EBCA6B);return ((a^(a>>>13))>>>0)/4294967296}
function hash(ix,iy,seed){let a=Math.imul(ix,374761393)^Math.imul(iy,668265263)^Math.imul(seed,1274126177);a=Math.imul(a^(a>>>13),1274126177);return ((a^(a>>>16))>>>0)/4294967295}
function noise(x,y,seed){const a=Math.floor(x),b=Math.floor(y);let fx=smooth(x-a),fy=smooth(y-b);const p=hash(a,b,seed),q=hash(a+1,b,seed),m=hash(a,b+1,seed),n=hash(a+1,b+1,seed);return (p+(q-p)*fx)*(1-fy)+(m+(n-m)*fx)*fy;}
function background(){ctx.fillStyle='#02040d';ctx.fillRect(0,0,W,H);const fog=ctx.createRadialGradient(cx,cy,r*.6,cx,cy,r*5);fog.addColorStop(0,'#271426');fog.addColorStop(.30,'#100a19');fog.addColorStop(1,'#02040d');ctx.fillStyle=fog;ctx.fillRect(0,0,W,H);const count=Math.min(1800,Math.floor(W*H/510));for(let i=0;i<count;i++){const x=rnd(i*113+7)*W,y=rnd(i*271+31)*H,dist=Math.hypot(x-cx,y-cy);if(dist<r*1.2)continue;const size=.3+rnd(i*53+1)*1.22,alpha=.06+rnd(i*89+17)*.6;ctx.fillStyle='rgba(210,225,255,'+alpha+')';ctx.fillRect(x,y,size,size);}}
function glowTexture(){
const scale=quality===.5?.67:quality===1?1:1.45;
const w=Math.ceil(W*scale),h=Math.ceil(r*5*scale),startY=Math.round((cy-r*2.5)*scale);
const off=document.createElement('canvas');off.width=w;off.height=h;
const oc=off.getContext('2d',{willReadFrequently:false});const im=oc.createImageData(w,h),a=im.data;
for(let j=0;j<h;j++){
 const dy=(startY+j)/scale-cy;
 for(let i=0;i<w;i++){
  const dx=i/scale-cx;
  const u=(dx*C+dy*S)/r,v=(-dx*S+dy*C)/r,au=Math.abs(u);
  if(au>3.58||Math.abs(v)>2.47)continue;
  const left=smooth((-u+.28)/1.65),right=smooth((u+.14)/1.9);
  const fade=smooth((3.59-au)/.66);
  const top=-.10-1.43*Math.exp(-Math.pow(u/1.37,2));
  const lower=.13+1.30*Math.exp(-Math.pow(au/1.29,2.5));
  const front=.54-.35*smooth((au-.53)/2.12);
  const n0=noise(u*4.5+v*.8,v*6.5,23);
  const n1=noise(u*15+v*2.7,v*14.0,45);
  const n2=noise(u*36-v*8,v*35,69);
  const n3=noise(u*7.5-v*3.5,v*14.3,99);
  const warp=.038*Math.sin(u*6.9+v*12+n1*3.5)+.019*Math.sin(u*18-v*9+n2*3);
  const vv=v+warp;
  const grain=.26+.92*(.38*n0+.29*n1+.21*n2+.12*n3);
  const shear=.67+.33*Math.sin(u*14+vv*18+n0*7)**2;
  const upper=Math.exp(-Math.pow((vv-top)/(.20+.13*Math.exp(-u*u/2)),2))*2.03;
  const upperHaze=Math.exp(-Math.pow((vv-top+.18)/(.38+.12*Math.exp(-u*u/2)),2))*.59;
  const lowerBeam=Math.exp(-Math.pow((vv-lower)/(.16+.07*Math.exp(-u*u/2)),2))*1.55;
  const lowerHaze=Math.exp(-Math.pow((vv-lower)/.36,2))*.27;
  const thick=.22+.20*right;
  const frontBeam=Math.exp(-Math.pow((vv-front)/thick,2))*1.79;
  const frontHaze=Math.exp(-Math.pow((vv-front)/(.45+.16*right),2))*.17;
  const hot=(1.72+1.2*n1)*Math.exp(-Math.pow((u+1.07)/.71,2)-Math.pow((vv-.26)/.43,2));
  const turbulence=(.45+.72*grain)*(.56+.67*shear);
  let luminous=(upper+upperHaze+lowerBeam+lowerHaze+frontBeam+frontHaze)*turbulence*fade+hot;
  // Fine lightning-like lanes within the broad plasma volume.
  const strands=Math.pow(Math.max(0,Math.sin(u*22.3+vv*26+n2*7)),13);
  luminous+=strands*(upper*.35+lowerBeam*.21+frontBeam*.27);
  const d=Math.hypot(u,v);
  if(d<.99)luminous=0;
  const rim=Math.exp(-Math.pow((d-1.018)/.024,2))*(.48+.43*left)*(.54+.46*(v<0?.7:1));
  luminous+=rim*1.75;
  if(luminous<.005)continue;
  const amp=Math.min(.995,1-Math.exp(-luminous*1.13));
  const lum=Math.min(1,luminous*.59);
  const whiteHot=smooth((luminous-.65)/2.15);
  const R=255,G=Math.min(255,114+119*left+67*lum+29*whiteHot),B=Math.min(255,42+145*left+81*lum+40*whiteHot);
  const idx=(j*w+i)*4;a[idx]=R;a[idx+1]=G;a[idx+2]=B;a[idx+3]=Math.round(amp*255);
 }
}
oc.putImageData(im,0,0);ctx.drawImage(off,0,startY/scale,w/scale,h/scale);
}
function fiberTrails(){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.globalCompositeOperation='screen';const wisps=quality===.5?150:quality===1?290:410;
for(let i=0;i<wisps;i++){const p=rnd(i*127+21),kind=i%3;let base=-2.88+5.76*p;let depth=rnd(i*43+13);const width=.08+.24*rnd(i*71+5);ctx.beginPath();for(let k=0;k<=13;k++){let u=base+(k/13-.5)*width*1.8;let v;
if(kind===0){v=-.07-(1.16+depth*.28)*Math.exp(-Math.pow(u/1.26,2));}
else if(kind===1){v=.11+(1.07+.32*depth)*Math.exp(-Math.pow(Math.abs(u)/1.25,2.6));}
else{v=.23+(depth-.5)*(.5+.34*smooth((u-.25)/1.5));}
v+=.008*Math.sin(u*12+i*1.7);if(!k)ctx.moveTo(r*u,r*v);else ctx.lineTo(r*u,r*v);}
const left=base<0;ctx.strokeStyle=left?'rgba(255,242,194,'+(.04+.09*rnd(i*83+9))+')':'rgba(255,139,66,'+(.03+.07*rnd(i*83+9))+')';ctx.lineWidth=.4+1.5*rnd(i*97+15);ctx.stroke();}
ctx.globalCompositeOperation='source-over';ctx.restore();}
function luminousArcs(){
ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.globalCompositeOperation='screen';
const arcs=quality===.5?15:quality===1?27:37;
for(let side=0;side<2;side++){
for(let j=0;j<arcs;j++){
const t=(j+.5)/arcs;
ctx.beginPath();
const seg=quality===.5?65:110;
for(let k=0;k<=seg;k++){
const u=-3.25+6.5*k/seg;
const shape=Math.exp(-Math.pow(Math.abs(u)/(side===0?1.27:1.25),side===0?2:2.6));
const contour=side===0?(-.07-(1.10+.38*t)*shape):(.11+(1.03+.35*t)*shape);
const jagged=.01*Math.sin(u*19+j*1.8)*shape;
if(k===0)ctx.moveTo(r*u,r*(contour+jagged));else ctx.lineTo(r*u,r*(contour+jagged));
}
const g=ctx.createLinearGradient(-r*3.3,0,r*3.3,0);
const opacity=(side===0?.15:.11)*(.35+.65*Math.sin(Math.PI*t));
g.addColorStop(0,'rgba(250,222,170,0)');g.addColorStop(.17,'rgba(255,244,206,'+(opacity*.65)+')');
g.addColorStop(.34,'rgba(255,250,222,'+(opacity*1.5)+')');g.addColorStop(.52,'rgba(255,202,109,'+opacity+')');
g.addColorStop(.78,'rgba(255,118,52,'+(opacity*.85)+')');g.addColorStop(1,'rgba(227,83,45,0)');
ctx.strokeStyle=g;ctx.lineWidth=r*(.021+.019*Math.sin(Math.PI*t));ctx.stroke();
}
}
ctx.globalCompositeOperation='source-over';ctx.restore();
}
function shadow(){
 const outer=ctx.createRadialGradient(cx,cy,r*.82,cx,cy,r*1.29);
 outer.addColorStop(0,'rgba(255,194,102,0)');outer.addColorStop(.46,'rgba(255,187,91,.14)');outer.addColorStop(1,'rgba(255,161,73,0)');
 ctx.fillStyle=outer;ctx.beginPath();ctx.arc(cx,cy,r*1.29,0,TAU);ctx.fill();
 ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,r*.976,0,TAU);ctx.fill();
 ctx.save();ctx.shadowColor='rgba(255,198,119,.84)';ctx.shadowBlur=r*.13;
 ctx.beginPath();ctx.arc(cx,cy,r*.991,0,TAU);
 ctx.strokeStyle='rgba(255,211,149,.63)';ctx.lineWidth=Math.max(1.1,r*.016);ctx.stroke();ctx.restore();
}
function nearBand(){
ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.globalCompositeOperation='screen';
const beams=quality===.5?26:quality===1?46:70;
for(let j=0;j<beams;j++){
 const t=(j+.5)/beams;
 ctx.beginPath();const n=quality===.5?78:125;
 for(let k=0;k<=n;k++){
  const u=-3.62+7.24*k/n,au=Math.abs(u);
  const mid=.56-.37*smooth((au-.5)/2.2);
  const v=mid+(t-.5)*(.20+.15*smooth((au-.6)/1.6))+.009*Math.sin(u*17+j*.8);
  if(k===0)ctx.moveTo(r*u,r*v);else ctx.lineTo(r*u,r*v);
 }
 const g=ctx.createLinearGradient(-r*3.7,0,r*3.7,0);
 const power=(.04+.11*Math.exp(-Math.pow((t-.47)/.27,2)));
 g.addColorStop(0,'rgba(255,235,192,0)');
 g.addColorStop(.21,'rgba(255,250,220,'+(power*.80)+')');
 g.addColorStop(.37,'rgba(255,254,230,'+(power*1.56)+')');
 g.addColorStop(.54,'rgba(255,217,129,'+(power*1.32)+')');
 g.addColorStop(.82,'rgba(255,137,61,'+(power*1.1)+')');
 g.addColorStop(1,'rgba(235,80,45,0)');
 ctx.strokeStyle=g;ctx.lineWidth=r*(.037+.025*Math.sin(t*Math.PI));ctx.stroke();
}
// Braided bright veins and fine turbulent sparks on the foreground plasma.
const veins=quality===.5?110:quality===1?220:330;
for(let i=0;i<veins;i++){
 const u=-3.55+7.10*rnd(i*61+13);
 const a=Math.abs(u),depth=rnd(i*89+21)-.5;
 const length=.09+.46*rnd(i*77+9);
 const base=.56-.37*smooth((a-.5)/2.2)+depth*.23;
 ctx.beginPath();
 for(let k=0;k<=10;k++){
  const uu=u+(k/10-.5)*length;
  const vv=base+.019*Math.sin(uu*16+i*1.9)+.010*Math.sin(uu*33+i*.6);
  if(k===0)ctx.moveTo(r*uu,r*vv);else ctx.lineTo(r*uu,r*vv);
 }
 ctx.strokeStyle=u<0?'rgba(255,251,219,'+(.075+.15*rnd(i*43+1))+')':'rgba(255,188,88,'+(.064+.12*rnd(i*43+1))+')';
 ctx.lineWidth=.55+1.75*rnd(i*71+5);ctx.stroke();
}
ctx.restore();
}
function render(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);cx=W*.5;cy=H*.51;r=Math.min(W*.172,H*.18,165);background();glowTexture();luminousArcs();fiberTrails();shadow();nearBand();document.getElementById('status').textContent='Radiant still · Motion intentionally disabled';}
const q=document.getElementById('quality');q.onclick=()=>{quality=quality===1?1.5:quality===1.5?.5:1;q.textContent='Detail: '+(quality===1?'High':quality===1.5?'Ultra':'Eco');render()};document.getElementById('back').onclick=()=>location.href='./';addEventListener('resize',()=>render(),{passive:true});render();})();
</script></body></html>
