 'use strict';
 const universeHost=document.getElementById('cosmos');
 let activeFrame=null,activeObserver=null;
 function bindBlackHoleScene(){
  try{
   const universe=universeHost.contentDocument;
   const frame=universe&&universe.getElementById('cosmos-hole-visit-frame');
   if(!frame||frame===activeFrame)return;
   if(activeObserver)activeObserver.disconnect();
   activeFrame=frame;
   const substitute=()=>{
    const current=frame.getAttribute('src');
    if(!current||current==='about:blank')return;
    const currentUrl=new URL(current,frame.ownerDocument.baseURI);
    if(!currentUrl.pathname.endsWith('/cosmos-black-hole-tour-extended-v065.html'))return;
    const approved=new URL('./cosmos-black-hole-radiance-v013.html',frame.ownerDocument.baseURI);
    approved.search=currentUrl.search;
    approved.hash=currentUrl.hash;
    frame.src=approved.href;
   };
   activeObserver=new MutationObserver(substitute);
   activeObserver.observe(frame,{attributes:true,attributeFilter:['src']});
   substitute();
  }catch(error){console.warn('COSMOS V13 tour scene unavailable',error);}
 }
 universeHost.addEventListener('load',bindBlackHoleScene);
 bindBlackHoleScene();
})();
</script></body></html>
