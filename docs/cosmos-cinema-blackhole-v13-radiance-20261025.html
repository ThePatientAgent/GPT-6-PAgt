<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#01030a"><title>COSMOS — Black Hole V13 Radiance</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E");mix-blend-mode:screen}
#frame{position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 110px 18px rgba(0,0,0,.37)}
@media(max-width:700px){#frame{box-shadow:inset 0 0 55px 6px rgba(0,0,0,.3)}}
@media(prefers-reduced-motion:reduce){#grain{display:none}}
</style></head>
<body><iframe id="cosmos" title="COSMOS cinematic black hole tour"></iframe><div id="grain"></div><div id="frame"></div>
<script>
(()=>{
'use strict';
const host=document.getElementById('cosmos');
function useNativeScene(frame){
 if(!frame||frame.dataset.radianceV13)return;
 frame.dataset.radianceV13='true';
 const rewrite=()=>{
  const src=frame.getAttribute('src');
  if(!src||src==='about:blank')return;
  const url=new URL(src,frame.ownerDocument.baseURI);
  if(!url.pathname.endsWith('/cosmos-black-hole-tour-extended-v065.html'))return;
  const target=new URL('./cosmos-black-hole-radiance-v013.html',frame.ownerDocument.baseURI);
  target.search=url.search;
  frame.src=target.href;
 };
 new MutationObserver(rewrite).observe(frame,{attributes:true,attributeFilter:['src']});
 rewrite();
}
function grade(doc){
 if(!doc||doc.getElementById('cinema-radiance-v13'))return;
 const s=doc.createElement('style');s.id='cinema-radiance-v13';
 s.textContent=`
#vignette{background:radial-gradient(ellipse at 50% 45%,transparent 29%,rgba(0,3,13,.19) 68%,rgba(0,2,9,.76) 112%)!important}
#nebula{filter:saturate(1.14) contrast(1.09)!important}
#warp.on{opacity:.84!important;filter:drop-shadow(0 0 15px rgba(121,188,255,.3))}
#hybridLayer{filter:saturate(1.10) contrast(1.06)}
@media(prefers-reduced-motion:reduce){#warp.on{animation:none!important}}
`;
 doc.head.appendChild(s);
 useNativeScene(doc.getElementById('cosmos-hole-visit-frame'));
}
host.addEventListener('load',()=>{
 try{
  const wrapper=host.contentDocument;
  useNativeScene(wrapper.getElementById('cosmos-bh-frame-v057'));
  const inner=wrapper.getElementById('cosmos');
  if(inner){inner.addEventListener('load',()=>grade(inner.contentDocument));grade(inner.contentDocument);}
 }catch(error){console.warn('COSMOS black hole tour enhancement unavailable',error);}
});
host.src='./index.html'+location.search;
})();
</script></body></html>
