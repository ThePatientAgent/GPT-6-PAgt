<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#060a18"><title>COSMOS — Continuous Space × Time</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#060a18;color:#f1f6ff;font-family:system-ui,-apple-system,sans-serif}body{min-height:100dvh}main{max-width:960px;margin:auto;padding:22px clamp(14px,4vw,40px) 42px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;color:#9cb8d4;letter-spacing:.19em;font-size:11px}.pill{border:1px solid #6787a855;padding:8px 12px;border-radius:30px;white-space:nowrap}h1{font-size:clamp(32px,7vw,64px);letter-spacing:-.055em;margin:24px 0 5px}p{color:#afc4df;line-height:1.7}.sub{font-size:13px;margin:0 0 15px}.stage{height:clamp(440px,70dvh,820px);touch-action:none;user-select:none;cursor:grab;position:relative;overflow:hidden;border:1px solid #4b78974d;border-radius:24px;background:#070d22;box-shadow:0 20px 75px #0008}canvas{display:block;width:100%;height:100%;pointer-events:none}.stage:active{cursor:grabbing}.hud{position:absolute;bottom:16px;left:17px;right:17px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:11px;color:#d4e6f5;text-shadow:0 2px 9px black}.hud span{background:#0a1527bb;border:1px solid #8ea5bd3d;border-radius:20px;padding:7px 11px;backdrop-filter:blur(8px)}.panel{margin-top:18px;background:#101d34;border:1px solid #668aab55;border-radius:22px;padding:20px}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}.head strong{font-size:16px}.read{color:#8ce5e3}.pad{height:clamp(165px,24vh,245px);margin-top:14px;border-radius:16px;position:relative;touch-action:none;user-select:none;cursor:crosshair;overflow:hidden;border:1px solid #74a5bf77;background:radial-gradient(ellipse at 65% 30%,#1d4861,#10223c 65%,#0b162b)}.grid{position:absolute;inset:0;background-image:linear-gradient(#8cacc321 1px,transparent 1px),linear-gradient(90deg,#8cacc321 1px,transparent 1px);background-size:10% 10%;pointer-events:none}.axis{position:absolute;pointer-events:none;background:#8fece999}.axis.x{height:1px;left:0;right:0;top:50%}.axis.y{width:1px;top:0;bottom:0;left:50%}.dot{position:absolute;left:100%;top:100%;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid white;background:#69e6df;box-shadow:0 0 0 8px #69e6df30,0 0 22px #69e6df;pointer-events:none}.label{position:absolute;font-size:11px;color:#b4d3e5;pointer-events:none;text-shadow:0 1px 5px #001}.tl{top:10px;left:12px}.tr{top:10px;right:12px}.bl{bottom:10px;left:12px}.br{bottom:10px;right:12px}.hint{font-size:12px;margin:12px 0 0}.foot{font-size:10px;color:#8196b1;margin-top:16px;text-align:center}.pad:focus-visible{outline:2px solid #9ff}.value{font-variant-numeric:tabular-nums}.gesture{position:absolute;top:16px;left:16px;right:16px;text-align:center;font-size:12px;letter-spacing:.08em;color:#c9e5f7;text-shadow:0 2px 10px #000;pointer-events:none;opacity:.85}.hud span{font-variant-numeric:tabular-nums} @media(max-width:520px){.top{font-size:9px;letter-spacing:.12em}.panel{padding:15px}.stage{height:70dvh;min-height:460px}.pad{height:200px}h1{margin-top:18px}}
</style></head><body><main><div class="top"><span>THE PATIENT AGENT / PROJECT WOW</span><span class="pill">COSMOS · 011</span></div><h1>時空を、なぞる。</h1><p class="sub">宇宙の上で指を滑らせる。左右で時間、上下で距離。</p>
<div class="stage" id="stage" tabindex="0" role="application" aria-label="宇宙を直接ドラッグして探索。左右に動かすと時間、上下に動かすと距離が変化します。矢印キーでも操作できます。"><canvas id="view" aria-label="連続的に変化する宇宙のイメージ"></canvas><div class="gesture">← 過去 · 未来 →　　↑ 近づく · 遠ざかる ↓</div><div class="hud"><span id="epoch">現在</span><span id="scale">宇宙全体</span></div></div><p class="sub" style="text-align:center;margin-top:13px">宇宙の画像を直接ドラッグ。斜めにも自由に動かせます。</p><p class="foot">科学をテーマにしたコンセプトアート。距離・時間・天体の位置を正確に再現したシミュレーションではありません。<br>Independent human–AI project · Not OpenAI</p></main>
<script>
'use strict';
const stage=document.getElementById('stage'),canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:false}),epoch=document.getElementById('epoch'),scale=document.getElementById('scale');let tx=1,ty=0,sx=1,sy=0,W=1,H=1,dpr=1,active=true;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)},seed=i=>{const v=Math.sin(i*127.1+31.7)*43758.5453;return v-Math.floor(v)};const stars=Array.from({length:850},(_,i)=>({x:seed(i*4),y:seed(i*4+1),r:.35+seed(i*4+2)*1.35,p:seed(i*4+3)*6.28}));function size(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}function glow(x,y,r,stops){if(r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);stops.forEach(s=>g.addColorStop(s[0],s[1]));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function layer(alpha,draw){if(alpha<=.001)return;ctx.save();ctx.globalAlpha=clamp(alpha);draw();ctx.restore()}function galaxy(x,y,r,rot,now,opacity=1){layer(opacity,()=>{ctx.save();ctx.translate(x,y);ctx.rotate(rot);glow(0,0,r*1.35,[[0,'#d7d8ff66'],[.38,'#6470c344'],[1,'#00000000']]);for(let i=0;i<620;i++){const f=Math.sqrt(seed(i+80)),a=i*2.39996+f*5.6+now*.000012*(1-f),rad=r*f;const px=Math.cos(a)*rad,py=Math.sin(a)*rad*.38;ctx.fillStyle=i%7===0?'#ffe2b4':'#b9d4ff';ctx.globalAlpha=.2+.8*seed(i+1300);ctx.beginPath();ctx.arc(px,py,.25+seed(i+2700)*1.35,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;glow(0,0,r*.22,[[0,'#fff8d9'],[.3,'#fce7b8c0'],[1,'#b0a2ff00']]);ctx.restore()})}function sphere(x,y,r,sun){if(r<=0)return;glow(x,y,r*1.7,[[0,sun?'#ffb95166':'#408bff3a'],[1,'#00000000']]);const g=ctx.createRadialGradient(x-r*.4,y-r*.4,r*.05,x,y,r);if(sun){g.addColorStop(0,'#fffbe8');g.addColorStop(.45,'#ffd78b');g.addColorStop(1,'#b74822')}else{g.addColorStop(0,'#e2ffff');g.addColorStop(.4,'#398fbd');g.addColorStop(.83,'#164782');g.addColorStop(1,'#020b1f')}ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();if(!sun){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.fillStyle='#7ac4a5aa';for(let i=0;i<12;i++){const px=x+(seed(i+52)*1.9-.95)*r,py=y+(seed(i+72)*1.9-.95)*r;ctx.beginPath();ctx.ellipse(px,py,r*(.1+seed(i+90)*.15),r*.09,seed(i+100)*6.28,0,6.283);ctx.fill()}ctx.restore()}}function frame(now){if(!active)return;const k=1-Math.exp(-.012*Math.min(40,now-(frame.last||now)));frame.last=now;sx=mix(sx,tx,k);sy=mix(sy,ty,k);ctx.fillStyle='#050a19';ctx.fillRect(0,0,W,H);glow(W*.5,H*.5,Math.max(W,H)*.72,[[0,'#21325e80'],[1,'#050a1900']]);const early=1-smooth(.02,.21,sx);layer(early*.8,()=>glow(W*.5,H*.5,Math.max(W,H)*.64,[[0,'#f6ae9866'],[.6,'#bb637244'],[1,'#00000000']]));for(let i=0;i<stars.length;i++){const s=stars[i],fade=(.24+.6*seed(i+5))*(1-.75*early);ctx.globalAlpha=fade*(.75+.25*Math.sin(now*.0005+s.p));ctx.fillStyle=i%9?'#c5d9ff':'#ffe0b9';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;const x=W*.5,y=H*.5,R=Math.min(W*.35,H*.43,215),zoom=Math.pow(10,sy*3.8),birth=smooth(.08,.34,sx),solar=smooth(.57,.73,sx);const universe=1-smooth(.10,.39,sy),gal=smooth(.09,.33,sy)*(1-smooth(.43,.64,sy)),sun=smooth(.40,.66,sy)*(1-smooth(.73,.91,sy)),earth=smooth(.72,.93,sy);layer(universe*birth,()=>{for(let i=0;i<5;i++){const a=i*2.4;galaxy(x+Math.cos(a)*R*.76,y+Math.sin(a)*R*.47,R*.38,-.32,now,.95)}});galaxy(x,y,R*mix(.9,2.2,smooth(.1,.65,sy)),-.35,now,gal*birth);layer(sun*birth,()=>sphere(x,y,R*mix(.16,1.05,smooth(.42,.8,sy)),true));layer(earth*solar,()=>sphere(x,y,R*mix(.12,1.06,smooth(.72,1,sy)),false));if(sy>.6&&solar<1){layer((1-solar)*sun,()=>glow(x+R*.65,y-R*.34,R*.12,[[0,'#fdf3d9'],[1,'#ffcc8a00']]))}requestAnimationFrame(frame)}function update(){epoch.textContent=tx<.12?'宇宙の夜明け':tx<.3?'最初の星':tx<.68?'銀河の成長':tx<.87?'太陽系の時代':'宇宙の現在';scale.textContent=ty<.23?'宇宙全体':ty<.51?'銀河群':ty<.79?'恒星系':'惑星へ接近'}let last=null;stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;stage.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY,id:e.pointerId}});stage.addEventListener('pointermove',e=>{if(!last||last.id!==e.pointerId)return;const r=stage.getBoundingClientRect();tx=clamp(tx+(e.clientX-last.x)/r.width);ty=clamp(ty-(e.clientY-last.y)/r.height);last={x:e.clientX,y:e.clientY,id:e.pointerId};update()});function stop(e){if(last&&last.id===e.pointerId)last=null}stage.addEventListener('pointerup',stop);stage.addEventListener('pointercancel',stop);stage.addEventListener('lostpointercapture',stop);stage.addEventListener('keydown',e=>{const step=e.shiftKey?.08:.025;if(e.key==='ArrowLeft')tx=clamp(tx-step);else if(e.key==='ArrowRight')tx=clamp(tx+step);else if(e.key==='ArrowUp')ty=clamp(ty+step);else if(e.key==='ArrowDown')ty=clamp(ty-step);else return;e.preventDefault();update()});addEventListener('resize',size);document.addEventListener('visibilitychange',()=>{if(document.hidden)active=false;else if(!active){active=true;frame.last=0;requestAnimationFrame(frame)}});size();update();requestAnimationFrame(frame);
</script></body></html>
