<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMOS | Black Hole Lab</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#f0f2ff;font:14px system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;pointer-events:none}h1{font-size:18px;letter-spacing:.22em;font-weight:500;margin:0 0 7px}p{margin:0;color:#b2b8d0;font-size:12px}.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;white-space:nowrap}button{background:#151b30bb;color:#eef;border:1px solid #68759a88;border-radius:24px;padding:11px 15px;font:inherit;backdrop-filter:blur(8px)}.note{position:absolute;top:max(90px,calc(env(safe-area-inset-top) + 70px));left:20px;max-width:270px;font-size:12px;line-height:1.6;color:#a8b0cd;pointer-events:none}.tag{position:absolute;right:15px;top:25px;color:#7e8eaf;font-size:10px;letter-spacing:.14em}
</style></head><body><canvas id="c"></canvas><header><h1>COSMOS / BLACK HOLE</h1><p>Volumetric plasma · refined gravitational lensing</p></header><div class="tag">LAB 028</div><div class="note">A flowing disk with upper and lower light paths around the shadow. Not a scientific ray-tracing simulation.</div><div class="controls"><button id="motion">Pause motion</button><button id="quality">Quality: Auto</button><button id="back">COSMOS ↗</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,stars=[],tick=0,last=0,playing=true,quality=1,raf=0;const PI=Math.PI*2;let cx=0,cy=0,r=100;const rnd=(seed)=>{let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296};function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);cx=W/2;cy=H*.51;r=Math.min(W*.16,H*.205,155);stars=[];const count=Math.min(800,Math.floor(W*H/950));for(let i=0;i<count;i++)stars.push({x:rnd(i*73+5)*W,y:rnd(i*119+11)*H,a:.15+rnd(i*31+9)*.75,z:.35+rnd(i*41+3)*1.1});}function background(){ctx.fillStyle='#02040d';ctx.fillRect(0,0,W,H);const haze=ctx.createRadialGradient(cx,cy,r*.9,cx,cy,r*5);haze.addColorStop(0,'#2a1430');haze.addColorStop(.35,'#0a0a21');haze.addColorStop(1,'#02040d');ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);for(const s of stars){let dx=s.x-cx,dy=s.y-cy,dist=Math.hypot(dx,dy),sx=s.x,sy=s.y;if(dist<r*3.4&&dist>r*.94){let deflect=r*r*.45/(dist*dist+.1);sx+=dx*deflect;sy+=dy*deflect;}if(dist<r*1.04)continue;ctx.globalAlpha=s.a;ctx.fillStyle='#d9e6ff';ctx.fillRect(sx,sy,s.z,s.z)}ctx.globalAlpha=1;}

// v028: thicker asymmetrical accretion flow and layered plasma turbulence.
const smooth=(x)=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function beamGradient(y,alpha){
const g=ctx.createLinearGradient(-r*3.35,y,r*3.35,y);
g.addColorStop(0,'rgba(255,222,153,0)');
g.addColorStop(.12,'rgba(255,245,200,'+(alpha*.62)+')');
g.addColorStop(.30,'rgba(255,251,223,'+Math.min(.95,alpha*1.45)+')');
g.addColorStop(.48,'rgba(255,207,116,'+(alpha*1.03)+')');
g.addColorStop(.76,'rgba(255,130,55,'+(alpha*.7)+')');
g.addColorStop(.92,'rgba(229,81,38,'+(alpha*.3)+')');
g.addColorStop(1,'rgba(204,63,35,0)');
return g;
}
function upperLensing(){
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.08);
const count=quality===.5?21:quality===1?32:44;
for(let j=count-1;j>=0;j--){
const t=j/(count-1),h=1.08+.33*(1-t);
ctx.beginPath();
const N=quality===.5?62:92;
for(let k=0;k<=N;k++){
const x=r*(-3.22+6.44*k/N);
const u=x/r;
const y=-r*(.055+h*Math.exp(-Math.pow(u/1.24,2)))+
r*(.021*Math.sin(u*10.7+tick*.53+j*1.37)+.009*Math.sin(u*25-tick*.82+j*.64))*Math.exp(-u*u/3);
if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.lineWidth=r*(.026+.042*(1-t));
ctx.strokeStyle=beamGradient(0,.030+.073*(1-t)*(.82+.18*Math.sin(j*1.83+tick*.48)**2));ctx.stroke();
}
// Short, gently flickering filaments break the overly perfect upper contour.
const wisps=quality===.5?24:quality===1?40:55;
for(let i=0;i<wisps;i++){
const u0=-2.55+5.1*((i*.61803398875+tick*.007)%1);
const h=1.12+.25*((i*.754877666)%1);
ctx.beginPath();
for(let k=0;k<=8;k++){
const u=u0+.34*k/8;
const y=-r*(.055+h*Math.exp(-Math.pow(u/1.24,2)))
+r*.024*Math.sin(u*10.7+tick*.53+i*1.13)*Math.exp(-u*u/3);
if(k===0)ctx.moveTo(r*u,y);else ctx.lineTo(r*u,y);
}
ctx.lineWidth=r*.014;
ctx.strokeStyle=u0<0?'rgba(255,244,193,.16)':'rgba(255,145,73,.12)';
ctx.stroke();
}
ctx.restore();
}
function belowLensing(){
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.08);
const count=quality===.5?21:quality===1?32:44;
for(let j=0;j<count;j++){
const t=j/(count-1),h=1.085+.245*t;
ctx.beginPath();
const N=quality===.5?64:90;
for(let k=0;k<=N;k++){
const u=-3.12+6.24*k/N, x=r*u;
const y=r*(.12+h*Math.exp(-Math.pow(Math.abs(u)/1.17,2.7)))+
r*(.019*Math.sin(u*12+tick*.46+j*.63)+.008*Math.sin(u*23-tick*.37+j*.91))*Math.exp(-u*u/3);
if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
}
ctx.strokeStyle=beamGradient(0,.135*(1-t)+.034);
ctx.lineWidth=r*(.023+.042*(1-t));ctx.stroke();
}
ctx.restore();
}
function disk(front){
if(!front){upperLensing();return;}
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.08);
ctx.beginPath();ctx.rect(-W,-H,2*W,2*H);ctx.arc(0,0,r*.99,0,Math.PI*2,true);ctx.clip('evenodd');
const N=quality===.5?32:quality===1?49:66;
const M=quality===.5?72:quality===1?96:118;
for(let j=0;j<N;j++){
const t=(j+.5)/N;
ctx.beginPath();
for(let k=0;k<=M;k++){
const u=-3.30+6.60*k/M;
const roll=r*(.04*Math.sin(u*2.6+tick*.33+t*8)*Math.exp(-u*u/9));
const spread=r*(t-.5)*(.42+.14*Math.exp(-u*u/3)+.25*smooth((u-.18)/1.85));
const y=r*.23+spread+roll;
if(k===0)ctx.moveTo(r*u,y);else ctx.lineTo(r*u,y);
}
ctx.strokeStyle=beamGradient(0,.026+.028*Math.sin(t*21+tick*.65)**2);
ctx.lineWidth=r*(.057+.037*Math.sin(t*17+tick*.15)**2);ctx.stroke();
}
const cells=quality===.5?420:quality===1?780:1180;
for(let i=0;i<cells;i++){
const u=-3.36+6.72*((i*.61803398875)%1);
const edge=smooth((3.36-Math.abs(u))/.55);
const depth=((i*.754877666)%1)-.5;
const swirl=.035*Math.sin(u*4.1+i*.27+tick*(.30+.14/(1+Math.abs(u))));
const right=smooth((u-.18)/1.85);
const y=r*(.23+depth*(.55+.25*right)+swirl);
const x=r*(u+.028*Math.sin(tick*.32+i*1.37));
const intensity=(.45+.55*Math.sin(u*8.2+i*.87+tick*.6)**2)*edge;
const size=r*(.045+.045*((i*.56984029)%1))*(1+.12*right);
ctx.beginPath();ctx.ellipse(x,y,size*1.9,size*.52,-.08,0,Math.PI*2);
ctx.fillStyle=u<-.38?'rgba(255,239,189,'+(.021+.043*intensity)+')':
 u<.6?'rgba(255,193,105,'+(.016+.039*intensity)+')':
 'rgba(255,113,52,'+(.023+.049*intensity)+')';
ctx.fill();
}
ctx.restore();
}
function hole(){
const halo=ctx.createRadialGradient(cx,cy,r*.86,cx,cy,r*1.62);
halo.addColorStop(0,'rgba(255,175,78,.06)');
halo.addColorStop(.33,'rgba(255,139,56,.13)');
halo.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,r*1.62,0,PI);ctx.fill();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,r*.99,0,PI);ctx.fill();
}
function frame(now){if(!document.hidden){const dt=Math.min(.04,(now-last)/1000||.016);last=now;if(playing)tick+=dt*1.65;background();disk(false);hole();belowLensing();disk(true);}raf=requestAnimationFrame(frame)}document.getElementById('motion').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause motion':'Resume motion'};document.getElementById('quality').onclick=e=>{quality=quality===1?.5:quality===.5?1.5:1;e.target.textContent='Quality: '+(quality===1?'Auto':quality===.5?'Eco':'High')};document.getElementById('back').onclick=()=>location.href='./';addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>last=performance.now());resize();raf=requestAnimationFrame(frame)})();
</script></body></html>
