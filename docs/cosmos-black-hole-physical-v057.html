const textureImgs=TEXTURES.map(url=>new Promise((resolve,reject)=>{
 const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url;
}));
const canvas=document.getElementById('picture');
const ctx=canvas.getContext('2d',{alpha:false});
const W=560,H=560, RIN=3.8, ROUT=20.;
canvas.width=W;canvas.height=H;
const colors=[[1,.78,.25],[1,.55,.08],[1,.29,.025],[.8,.07,.012],[.45,.018,.012]];
const weights=[1,1.2,.7];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

     const far=Math.sin(phi)<0;

     let emissivity=Math.pow(rho/RIN,-1.5)*Math.exp(-.8*(rho-RIN)/(ROUT-RIN));
     emissivity/=1+Math.exp(clamp((rho-cutoff)/.9,-50,50));
     const turbulence=1+.75*(.30*Math.sin(2.3*rho-8*phi)+.25*Math.sin(6.4*rho-15*phi)+.16*Math.sin(17*rho+7*phi)+.10*Math.cos(32*rho-3*phi));
     const boost=Math.pow(clamp(dop,.5,1.8),2.25);

     const j=Math.floor(temp),q=temp-j;
     const e=4.1*emissivity*boost*Math.max(.2,turbulence)*weights[h];

     gg+=e*(colors[j][1]*(1-q)+colors[j+1][1]*q);
     bb+=e*(colors[j][2]*(1-q)+colors[j+1][2]*q);

   dest[idx+2]=Math.round(255*Math.pow(clamp(bb,0,1),.85));
   dest[idx+3]=255;
