<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#01030a"><title>COSMOS — Black Hole Thick Disk V5</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E");mix-blend-mode:screen}
#frame{position:fixed;inset:0;z-index:4;pointer-events:none;box-shadow:inset 0 0 110px 18px rgba(0,0,0,.37)}
@media(max-width:700px){#frame{box-shadow:inset 0 0 55px 6px rgba(0,0,0,.3)}}
@media(prefers-reduced-motion:reduce){#grain{display:none}}
</style></head>
<body><iframe id="cosmos" title="COSMOS cinematic experimental tour" src="./index.html"></iframe><div id="grain"></div><div id="frame"></div>
<script>
const frame=document.getElementById('cosmos');
function enhanceBlackHole(doc){
 const layer=doc.getElementById('cosmos-bh-layer-v057');
 if(!layer||layer.dataset.cinemaBh==='v2')return;
 layer.dataset.cinemaBh='v2';
 const bh=doc.getElementById('cosmos-bh-frame-v057');
 if(!bh)return;
 const install=()=>{
  try{
   const d=bh.contentDocument;
   if(!d||d.getElementById('cosmos-cinema-bh-v3'))return;
   const st=d.createElement('style');st.id='cosmos-cinema-bh-v3';
   st.textContent=`
/* Optical enhancement outside the original 0.60-sized accretion artwork. */
main>section{isolation:isolate}
main>section:before{content:"";position:absolute;z-index:0;pointer-events:none;
 inset:-28% -38%;border-radius:50%;opacity:.7;
 background:radial-gradient(ellipse 48% 27% at 50% 50%,transparent 33%,rgba(255,165,53,.48) 53%,rgba(232,76,21,.24) 73%,transparent 90%);
 filter:blur(9px);animation:cosmos-bh-pulse 5s ease-in-out infinite alternate}
main>section:after{content:"";position:absolute;z-index:0;pointer-events:none;
 inset:-34% -42%;opacity:.58;
 background:radial-gradient(ellipse 58% 12% at 50% 49%,transparent 39%,rgba(255,206,92,.58) 61%,transparent 87%);
 transform:rotate(-14deg);filter:blur(12px);
 animation:cosmos-bh-flare 7s ease-in-out infinite alternate}
@keyframes cosmos-bh-pulse{from{opacity:.62;filter:blur(18px)}to{opacity:1;filter:blur(13px)}}
@keyframes cosmos-bh-flare{from{opacity:.60;transform:rotate(-15deg)}to{opacity:1;transform:rotate(-12deg)}}
@media(prefers-reduced-motion:reduce){main>section:before,main>section:after{animation:none!important}}
`;
   d.head.appendChild(st);
  }catch(e){}
 };
 bh.addEventListener('load',install);install();
}

frame.addEventListener('load',()=>{
try{
 const wrapper=frame.contentDocument;enhanceBlackHole(wrapper);
 const inner=wrapper.getElementById('cosmos');
 if(!inner)return;
 function grade(){
   try{
     const d=inner.contentDocument;
     if(!d||d.getElementById('cinema-grade-v1'))return;
     const s=d.createElement('style');s.id='cinema-grade-v1';
     s.textContent=`
/* Cinema-grade preview: additive, non-destructive. Native navigation untouched. */
#vignette{background:radial-gradient(ellipse at 50% 45%,transparent 29%,rgba(0,3,13,.19) 68%,rgba(0,2,9,.76) 112%)!important}
#nebula{filter:saturate(1.14) contrast(1.09)!important}
#warp.on{opacity:.84!important;filter:drop-shadow(0 0 15px rgba(121,188,255,.3))}
#hybridLayer{filter:saturate(1.10) contrast(1.06)}
@media(prefers-reduced-motion:reduce){#warp.on{animation:none!important}}
`;
     d.head.appendChild(s);
     // The automatic tour uses a DIFFERENT iframe from the manual black-hole button.
     const tour=d.getElementById('cosmos-hole-visit-frame');
     if(tour&&!tour.dataset.cinemaTourV5){
       tour.dataset.cinemaTourV4='1';
       const illuminate=()=>{
         try{
           const td=tour.contentDocument;
           if(!td||td.getElementById('cinema-tour-v5'))return;
           const ts=td.createElement('style');ts.id='cinema-tour-v4';
           ts.textContent=`
main>section{isolation:isolate}
main>section:before{content:"";position:absolute;z-index:5;inset:-30% -35%;pointer-events:none;
background:radial-gradient(ellipse 43% 21% at 50% 50%,transparent 21%,rgba(255,238,160,.94) 38%,rgba(255,153,42,.72) 61%,rgba(233,63,15,.13) 73%,transparent 88%);
filter:blur(11px);transform:rotate(-12deg);mix-blend-mode:screen;animation:cinemaTourPulse 5s ease-in-out infinite alternate}
main>section:after{content:"";position:absolute;z-index:5;inset:-37% -43%;pointer-events:none;
background:radial-gradient(ellipse 55% 31% at 50% 50%,transparent 28%,rgba(255,166,42,.58) 62%,transparent 81%);
filter:blur(16px);transform:rotate(10deg);mix-blend-mode:screen;animation:cinemaTourFlare 7s ease-in-out infinite alternate}
@keyframes cinemaTourPulse{from{opacity:.54;transform:rotate(-13deg) scale(.96)}to{opacity:1;transform:rotate(-10deg) scale(1.06)}}
@keyframes cinemaTourFlare{from{opacity:.48;transform:rotate(5deg)}to{opacity:1;transform:rotate(14deg)}}
@media(prefers-reduced-motion:reduce){main>section:before,main>section:after{animation:none!important}}
`;
           td.head.appendChild(ts);
         }catch(e){}
       };
       tour.addEventListener('load',illuminate);illuminate();
     }

   }catch(e){}
 }
 inner.addEventListener('load',grade);grade();
}catch(e){}
});
</script></body></html>
