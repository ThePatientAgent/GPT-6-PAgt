<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMOS — 10s promo capture staging</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden;color:white;font:12px system-ui}iframe{position:absolute;width:100%;height:100%;border:0;inset:0}section{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s linear}section.active{opacity:1}#hud{position:fixed;bottom:calc(15px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;z-index:9;text-shadow:0 2px 8px #000}button{padding:12px 20px;border-radius:30px;border:1px solid #9b7b5b;background:#140c08;color:white;font:600 13px system-ui}body.record #hud{display:none}</style></head><body><section id="sun" class="active"><iframe title="Actual COSMOS Sun" src="./cosmos-promo-scenes-v001.html?start=solar%20system&sky=eco&promoHold=1&revision=promo-v002"></iframe></section><section id="pleiades"><iframe title="Actual COSMOS Pleiades" loading="eager" src="./cosmos-promo-scenes-v001.html?start=pleiades&sky=eco&promoHold=1&revision=promo-v002"></iframe></section><section id="blackhole"><iframe title="Approved V13 Radiance black hole" loading="eager" src="./cosmos-black-hole-radiance-v013.html?revision=cygnus-v222"></iframe></section><div id="hud"><button id="play">▶ Play 10-second preview</button><p>Sun 0–3s · Pleiades 3–6s · V13 6–10s</p><p>Preview staging only — not a 60fps MP4 recording</p></div><script>(()=>{const ids=['sun','pleiades','blackhole'],sections=ids.map(id=>document.getElementById(id));let timers=[];function show(n){sections.forEach((s,i)=>s.classList.toggle('active',i===n));}function play(){timers.forEach(clearTimeout);show(0);timers=[setTimeout(()=>show(1),3000),setTimeout(()=>show(2),6000),setTimeout(()=>{document.body.classList.remove('record')},10000)];document.body.classList.add('record');}document.getElementById('play').addEventListener('click',play);if(new URLSearchParams(location.search).has('autoplay')){window.addEventListener('load',()=>setTimeout(play,1200),{once:true});}})();</script></body></html>
