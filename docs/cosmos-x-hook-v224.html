on></div></div><div class="scene" id="tour" hidden><iframe id="cosmos" title="Full COSMOS tour" allow="fullscreen"></iframe></div><script>(()=>{'use strict';const hook=document.getElementById('hook'),tour=document.getElementById('tour'),bh=document.getElementById('bh'),cosmos=document.getElementById('cosmos');/* Touch controls rotate the surrounding scene, never distort the approved V13 disk. */
