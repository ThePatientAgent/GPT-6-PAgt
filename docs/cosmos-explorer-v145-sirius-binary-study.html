`;

/* v145: replace the painted Sirius card with a luminous stellar photosphere.

try{

 @media(prefers-reduced-motion:reduce){.cosmos-v145-star:after{animation:none}}
 /* Remove fictional planetary environment only during Sirius orbit. */
 body.cosmos-v145-at-sirius .solar-ring,

 `;

 style.textContent=`

/* v145: Pleiades tour compositor budget experiment.

 budget.textContent=`

/* v108: One-time Jupiter texture bake. No per-frame canvas rendering. 
   Reuses the third projected planet slot without modifying journey logic. */
try {
 const labels=[...d.querySelectorAll('.solar-planet-label')];
 const mars=labels.find(el=>el.textContent.trim()==='MARS');
 const planets=[...d.querySelectorAll('.local-satellite')];
 if(mars&&planets.length>=3){
   mars.textContent='JUPITER';
   const N=384,cv=d.createElement('canvas');cv.width=cv.height=N;
   const ctx=cv.getContext('2d',{alpha:true});
   if(ctx){
    const img=ctx.createImageData(N,N),px=img.data;
    // v109: contrast-separated belts, turbulent cloud filaments, and unmistakable Great Red Spot.
    // v110: broad high-contrast belts survive small on-screen projection.
    const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
    const palette=[[243,226,199],[169,102,72],[244,227,203],[137,79,61],[239,215,184],[172,99,72],[250,232,204],[151,83,62],[245,222,190],[168,98,73],[246,226,198]];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const nx=(x+.5-N/2)/(N*.475),ny=(y+.5-N/2)/(N*.475),r=nx*nx+ny*ny,i=(y*N+x)*4;
      if(r>=1){px[i+3]=0;continue}
      const z=Math.sqrt(1-r),lon=Math.atan2(nx,z),lat=Math.asin(ny);
      const wave=.027*Math.sin(lon*7+lat*19+1.2*Math.sin(lon*3-lat*8))+.014*Math.sin(lon*15-lat*35)+.009*Math.sin(lon*31+lat*69)+.004*Math.sin(lon*67-lat*129)+.0025*Math.sin(lon*127+lat*217);
      const band=(lat+wave+Math.PI/2)/Math.PI*(palette.length-1);
      const k=Math.max(0,Math.min(palette.length-1,Math.floor(band)));
      const f=smooth(.35,.65,band-k),p=palette[k],q=palette[Math.min(k+1,palette.length-1)];
      const eddy=Math.sin(lon*11-lat*27+1.8*Math.sin(lon*5+lat*13));
      const wisps=10*Math.sin(lon*23+lat*103+2.3*eddy)+6*Math.sin(lon*51-lat*161+1.4*eddy)+3*Math.sin(lon*109+lat*243)+1.6*Math.sin(lon*181-lat*361)+1.3*Math.sin(lon*239+lat*417+eddy);
      let R=p[0]*(1-f)+q[0]*f+wisps,G=p[1]*(1-f)+q[1]*f+wisps*.8,B=p[2]*(1-f)+q[2]*f+wisps*.65;
      const dx=(nx-.13)/.38,dy=(ny-.29)/.22,angle=Math.atan2(dy,dx),dist=Math.hypot(dx,dy);
      const warped=dist+.060*Math.sin(angle*6+dist*9)+.034*Math.sin(angle*11-dist*15)+.018*Math.sin(angle*17+dist*23);
      const ring=(1-smooth(.90,1.20,warped))*(smooth(.57,.80,warped));
      const core=1-smooth(.70,.95,warped);
      R=R*(1-ring)+ring*164;G=G*(1-ring)+ring*77;B=B*(1-ring)+ring*60;
      R=R*(1-core)+core*(219+12*Math.sin(angle*3-dist*14));G=G*(1-core)+core*(118+13*Math.sin(angle*3-dist*14));B=B*(1-core)+core*(90+10*Math.sin(angle*3-dist*14));
      const light=Math.max(.47,.74+.29*z-.17*nx-.045*ny);
      const limb=smooth(0,.065,1-r);
      px[i]=Math.min(255,R*light);px[i+1]=Math.min(255,G*light);px[i+2]=Math.min(255,B*light);px[i+3]=Math.round(limb*255);
    }
    ctx.putImageData(img,0,0);
    const jupiterImage=planets[2];
    /* v145: finger-anchored drag, followed by a bounded visual glide.
       Touch routing stays selective: the surrounding sky retains camera control. */
    let drag=null,ox=0,oy=0,glide=null;
    const center=()=>{const r=jupiterImage.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}};
    const jupiterHit=t=>{
      const r=center(),st=d.defaultView.getComputedStyle(jupiterImage);
      return st.display!=='none'&&Number(st.opacity)>=.12&&r.w>=10&&r.h>=10&&Math.hypot(t.clientX-r.x,t.clientY-r.y)<=Math.max(22,Math.min(r.w,r.h)*.55);
    };
    const anchor=(x,y)=>{
      const p=center();
      // Use measured screen-space error rather than assuming local CSS pixels
      // map one-to-one through the planet's transformed DOM ancestry.
      const targetX=x-drag.offsetX,targetY=y-drag.offsetY;
      const dx=targetX-p.x,dy=targetY-p.y;
      ox+=dx;oy+=dy;
      jupiterImage.style.translate=ox+'px '+oy+'px';
    };
    d.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      const t=e.touches[0];
      if(!jupiterHit(t))return;
      if(glide){d.defaultView.cancelAnimationFrame(glide);glide=null;}
      const p=center();
      drag={id:t.identifier,offsetX:t.clientX-p.x,offsetY:t.clientY-p.y,x:t.clientX,y:t.clientY,last:performance.now(),vx:0,vy:0};
      status.textContent='v145 JUPITER CAPTURED';
      e.preventDefault();e.stopImmediatePropagation();
    },{capture:true,passive:false});
    d.addEventListener('touchmove',e=>{
      if(!drag)return;
      const t=[...e.touches].find(t=>t.identifier===drag.id);
      if(!t)return;
      const now=performance.now(),dt=Math.max(8,now-drag.last);
      drag.vx=.7*drag.vx+.3*(t.clientX-drag.x)/dt;
      drag.vy=.7*drag.vy+.3*(t.clientY-drag.y)/dt;
      drag.x=t.clientX;drag.y=t.clientY;drag.last=now;
      anchor(t.clientX,t.clientY);
      status.textContent='v145 JUPITER DRAG';
      e.preventDefault();e.stopImmediatePropagation();
    },{capture:true,passive:false});
    for(const name of ['touchend','touchcancel'])d.addEventListener(name,e=>{
      if(!drag||[...e.touches].some(t=>t.identifier===drag.id))return;
      const v=drag;drag=null;
      const speed=Math.hypot(v.vx,v.vy);
      if(name==='touchcancel'||speed<.08){status.textContent='v145 Jupiter released';return;}
      let vx=Math.max(-.65,Math.min(.65,v.vx)),vy=Math.max(-.65,Math.min(.65,v.vy)),last=performance.now(),elapsed=0;
      status.textContent='v145 Jupiter gliding';
      const step=now=>{
        const dt=Math.min(32,now-last);last=now;elapsed+=dt;
        const friction=Math.pow(.90,dt/16);
        ox+=vx*dt;oy+=vy*dt;
        jupiterImage.style.translate=ox+'px '+oy+'px';
        vx*=friction;vy*=friction;
        if(elapsed<650&&Math.hypot(vx,vy)>.025)glide=d.defaultView.requestAnimationFrame(step);
        else{glide=null;status.textContent='v145 Jupiter settled';}
      };
      glide=d.defaultView.requestAnimationFrame(step);
    },{capture:true,passive:true});
    // v127: the base engine reassigns satellites[j].src when destination types
    // change. Keep the third sprite's texture consistent with the new JUPITER label.
    // MutationObserver runs only on src changes, not on every animation frame.
    let jupiterTextureUrl=null;
    let restoringJupiter=false;
    const jupiterSourceGuard=new d.defaultView.MutationObserver(()=>{
      if(restoringJupiter||!jupiterTextureUrl||jupiterImage.getAttribute('src')===jupiterTextureUrl)return;
      restoringJupiter=true;
      jupiterImage.src=jupiterTextureUrl;
      restoringJupiter=false;
    });
    jupiterSourceGuard.observe(jupiterImage,{attributes:true,attributeFilter:['src']});
    const textureUrl=cv.toDataURL('image/png');
    const probe=new d.defaultView.Image();
    probe.onload=()=>{
      jupiterTextureUrl=textureUrl;
      jupiterImage.src=textureUrl;
      jupiterImage.style.objectFit='fill';
