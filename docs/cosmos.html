<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070c1c"><title>Project WOW — COSMOS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050916;color:#eef5ff;font-family:system-ui,-apple-system,sans-serif}body{overflow-x:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.stage{position:relative;flex:none;height:clamp(260px,39vh,440px);width:100%;overflow:hidden;isolation:isolate;border-radius:18px;background:radial-gradient(ellipse at center,#16244c55,#05091600 70%)}
.shell{position:relative;z-index:2;pointer-events:none;min-height:100dvh;display:flex;flex-direction:column;justify-content:flex-start;gap:12px;padding:clamp(18px,4vw,42px)}
.top{display:flex;justify-content:space-between;align-items:start;gap:12px}.brand{font-size:11px;letter-spacing:.25em;color:#a4c4eb}.tag{font-size:11px;color:#9bb2d0;border:1px solid #647a9c55;border-radius:30px;padding:8px 12px}
.hero{margin-top:clamp(30px,9vh,120px);max-width:600px}.eyebrow{color:#9be7e3;letter-spacing:.22em;font-size:11px;font-weight:700}.hero h1{font-size:clamp(38px,8vw,90px);line-height:1.03;margin:14px 0 8px;letter-spacing:-.06em;text-shadow:0 5px 50px #030817}.hero p{font-size:clamp(13px,2vw,17px);line-height:1.8;color:#bdcfe7;max-width:420px}
.panel{pointer-events:auto;max-width:850px;width:100%;margin:0 auto;padding:20px 24px;background:linear-gradient(125deg,#12213cdd,#0b1528e8);border:1px solid #8bb5df44;border-radius:24px;box-shadow:0 16px 90px #0009;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.panel-head strong{font-size:15px}.panel-head span{font-size:12px;color:#9fc1dc}
input[type=range]{width:100%;accent-color:#86ebeb;cursor:pointer;margin:18px 0 9px}
.eras{display:flex;justify-content:space-between;color:#8fa6c7;font-size:10px;gap:8px}
.zoom{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.zoom button{cursor:pointer;border:1px solid #6c87a355;background:#152844bb;color:#c5d8ee;padding:12px 3px;border-radius:12px;font-size:12px;transition:background .2s,transform .2s}.zoom button[aria-pressed=true]{background:#277e92;color:#fff;border-color:#9cf5f4}.zoom button:active{transform:scale(.96)}
.status{min-height:38px;color:#b9d1e9;font-size:12px;line-height:1.6;margin:12px 0 0}.foot{font-size:10px;color:#8396b2;text-align:center;margin-top:14px}
@media(max-width:799px){.shell{min-height:100dvh;padding:18px 14px 22px}.hero{margin-top:12px;max-width:100%}.stage{height:clamp(230px,31vh,330px)}.hero h1{font-size:clamp(30px,9vw,46px);margin:8px 0 4px}.hero p{font-size:12px;line-height:1.55;max-width:85%;margin:4px 0}.panel{margin-top:0;padding:14px 16px;border-radius:18px}.zoom{margin-top:12px}.zoom button{padding:11px 2px}.status{margin-top:8px;min-height:24px}.foot{margin-top:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.top .brand{max-width:65%}}@media(min-width:800px){.hero{margin-left:6vw}.panel{margin-bottom:2vh}}
@media(max-height:690px){.hero{margin-top:15px}.hero h1{font-size:40px}.hero p{margin:6px 0}.panel{padding:14px}}
</style></head><body>
<div class="shell"><div><div class="top"><div class="brand">THE PATIENT AGENT / PROJECT WOW</div><div class="tag">COSMOS · 006</div></div>
<div class="hero"><div class="eyebrow">EXPLORE SPACE × TIME</div><h1 id="title">宇宙の現在</h1><p id="description">時間を動かし、宇宙から惑星まで視点を変える。138億年を旅しよう。</p></div></div>
<div class="stage" id="stage"><canvas id="space" aria-label="宇宙の模式的なアニメーション"></canvas></div>
<div><div class="panel"><div class="panel-head"><strong>宇宙の時間</strong><span id="age">約138億年後</span></div>
<input id="time" aria-label="宇宙の時間" type="range" min="0" max="4" step="1" value="4">
<div class="eras"><span>38万年</span><span>2億年</span><span>10億年</span><span>92億年</span><span>現在</span></div>
<div class="zoom" aria-label="観察スケール"><button data-z="0" aria-pressed="true">宇宙</button><button data-z="1" aria-pressed="false">銀河</button><button data-z="2" aria-pressed="false">恒星</button><button data-z="3" aria-pressed="false">惑星</button></div>
<p class="status" id="status" role="status">観察するスケールを選んでください。</p></div>
<div class="foot">SCIENTIFIC CONCEPT ART · 教育用の模式表現。位置・縮尺は観測データではありません。<br>Independent human–AI project · Not OpenAI</div></div></div>
<script>
'use strict';
const stage=document.getElementById('stage'),c=document.getElementById('space'),ctx=c.getContext('2d',{alpha:false}),timeEl=document.getElementById('time'),title=document.getElementById('title'),desc=document.getElementById('description'),age=document.getElementById('age'),status=document.getElementById('status');
const eras=[['宇宙の夜明け','約38万年後','最初の原子が形成され、光が遠くまで進めるようになった。'],['最初の星','約2億年後','宇宙の暗黒時代が終わり、初期の恒星が輝き始める。'],['銀河の成長','約10億年後','若い銀河が成長し、星の誕生が進んでいく。'],['太陽系の誕生','約92億年後','太陽と惑星が形成され、地球の歴史が始まる。'],['宇宙の現在','約138億年後','宇宙は今も膨張を続けている。私たちは銀河の中の一つの惑星に暮らしている。']];
let t=4,z=0,W=0,H=0,dpr=1,stars=[],running=true;
function random(i){let x=Math.sin(i*127.1+47.9)*43758.5453;return x-Math.floor(x)}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:360},(_,i)=>({x:random(i*3)*W,y:random(i*3+1)*H,r:.3+random(i*3+2)*1.5,p:random(i+777)*6.28}));render(performance.now())}
function setState(){t=+timeEl.value;title.textContent=eras[t][0];age.textContent=eras[t][1];desc.textContent=eras[t][2];document.querySelectorAll('[data-z]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.z===z)));let valid=z===0||(z===1&&t>=2)||(z===2&&t>=1)||(z===3&&t>=3);status.textContent=valid?['宇宙の大規模構造を観察中','銀河を観察中','恒星を観察中','惑星を観察中'][z]:'この時代には、選んだ天体はまだ形成されていません。';render(performance.now())}
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);for(const [p,v] of color)g.addColorStop(p,v);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function ellipseStars(cx,cy,rx,ry,now){ctx.save();ctx.translate(cx,cy);ctx.rotate(-.34);glow(0,0,rx*1.4,[[0,'#ffeac355'],[.35,'#9a9de633'],[1,'#283da500']]);for(let i=0;i<480;i++){const f=Math.sqrt(random(i+240));let a=i*2.39996+now*.000015*(1-f);const x=Math.cos(a)*rx*f,y=Math.sin(a)*ry*f;ctx.fillStyle=i%5?'#b5caff':'#ffe5ad';ctx.globalAlpha=.18+.8*random(i+99);ctx.beginPath();ctx.arc(x,y,random(i+13)*1.4+.3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;glow(0,0,rx*.19,[[0,'#fff9d8'],[.3,'#ffe3a2aa'],[1,'#cba4ff00']]);ctx.restore()}
function sphere(cx,cy,r,sun){glow(cx,cy,r*1.75,[[0,sun?'#ffb74755':'#4b9eff33'],[1,'#00000000']]);let g=ctx.createRadialGradient(cx-r*.38,cy-r*.38,r*.03,cx,cy,r);g.addColorStop(0,sun?'#fffce6':'#d0f7ff');g.addColorStop(.38,sun?'#ffe1a0':'#3b9ccc');g.addColorStop(.8,sun?'#e67a30':'#123c7c');g.addColorStop(1,sun?'#682418':'#02091d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();if(!sun){ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();ctx.fillStyle='#72c9a1aa';for(let i=0;i<9;i++){let x=cx-r*.9+random(i+16)*r*1.8,y=cy-r*.9+random(i+34)*r*1.8;ctx.beginPath();ctx.ellipse(x,y,r*(.12+random(i+4)*.19),r*.12,random(i+9)*3,0,Math.PI*2);ctx.fill()}ctx.restore()}}
function render(now){if(!ctx)return;ctx.fillStyle='#050916';ctx.fillRect(0,0,W,H);glow(W*.53,H*.38,Math.max(W,H)*.7,[[0,t===0?'#59374e77':'#202e6455'],[1,'#05091600']]);for(let i=0;i<stars.length;i++){const s=stars[i];ctx.globalAlpha=.25+.55*(.5+.5*Math.sin(now*.0006+s.p));ctx.fillStyle=i%8===0?'#ffd8b8':'#c6d9ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const mobile=W<800;const x=W*.5,y=H*.5,r=Math.min(W*.24,H*.37,mobile?130:225);const valid=z===0||(z===1&&t>=2)||(z===2&&t>=1)||(z===3&&t>=3);if(valid){if(z===0){if(t===0){glow(x,y,r*1.6,[[0,'#ffc5a577'],[.6,'#b76a6e33'],[1,'#0000']])}else{for(let j=0;j<Math.min(t+1,5);j++)ellipseStars(x+Math.cos(j*2.1)*r*.72,y+Math.sin(j*2.1)*r*.45,r*(.4+random(j)*.2),r*.2,now)}}else if(z===1){ellipseStars(x,y,r*1.5,r*.62,now)}else if(z===2){sphere(x,y,r*.74,true);if(t>=3){ctx.strokeStyle='#86b7e044';ctx.beginPath();ctx.ellipse(x,y,r*1.5,r*.55,-.28,0,Math.PI*2);ctx.stroke();sphere(x+r*1.34,y-r*.4,r*.11,false)}}else{sphere(x,y,r,true===false);}}else{glow(x,y,r,[[0,'#647ba833'],[1,'#0000']])}if(running)requestAnimationFrame(render)}
timeEl.addEventListener('input',setState);document.querySelectorAll('[data-z]').forEach(b=>b.addEventListener('click',()=>{z=+b.dataset.z;setState()}));addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running)requestAnimationFrame(render)});resize();setState();
</script></body></html>
