<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMOS | Black Hole Lab</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#f0f2ff;font:14px system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;pointer-events:none}h1{font-size:18px;letter-spacing:.22em;font-weight:500;margin:0 0 7px}p{margin:0;color:#b2b8d0;font-size:12px}.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;white-space:nowrap}button{background:#151b30bb;color:#eef;border:1px solid #68759a88;border-radius:24px;padding:11px 15px;font:inherit;backdrop-filter:blur(8px)}.note{position:absolute;top:max(90px,calc(env(safe-area-inset-top) + 70px));left:20px;max-width:270px;font-size:12px;line-height:1.6;color:#a8b0cd;pointer-events:none}.tag{position:absolute;right:15px;top:25px;color:#7e8eaf;font-size:10px;letter-spacing:.14em}
</style></head><body><canvas id="c"></canvas><header><h1>COSMOS / BLACK HOLE</h1><p>Experimental gravitational lensing study</p></header><div class="tag">LAB 001</div><div class="note">A stylized, real-time visualization of a black hole, accretion disk and gravitational lensing. Not a scientific ray-tracing simulation.</div><div class="controls"><button id="motion">Pause motion</button><button id="quality">Quality: Auto</button><button id="back">COSMOS ↗</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,stars=[],tick=0,last=0,playing=true,quality=1,raf=0;const PI=Math.PI*2;let cx=0,cy=0,r=100;const rnd=(seed)=>{let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296};function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);cx=W/2;cy=H*.51;r=Math.min(W*.16,H*.205,155);stars=[];const count=Math.min(800,Math.floor(W*H/950));for(let i=0;i<count;i++)stars.push({x:rnd(i*73+5)*W,y:rnd(i*119+11)*H,a:.15+rnd(i*31+9)*.75,z:.35+rnd(i*41+3)*1.1});}function background(){ctx.fillStyle='#02040d';ctx.fillRect(0,0,W,H);const haze=ctx.createRadialGradient(cx,cy,r*.9,cx,cy,r*5);haze.addColorStop(0,'#2a1430');haze.addColorStop(.35,'#0a0a21');haze.addColorStop(1,'#02040d');ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);for(const s of stars){let dx=s.x-cx,dy=s.y-cy,dist=Math.hypot(dx,dy),sx=s.x,sy=s.y;if(dist<r*3.4&&dist>r*.94){let deflect=r*r*.45/(dist*dist+.1);sx+=dx*deflect;sy+=dy*deflect;}if(dist<r*1.04)continue;ctx.globalAlpha=s.a;ctx.fillStyle='#d9e6ff';ctx.fillRect(sx,sy,s.z,s.z)}ctx.globalAlpha=1;}
function disk(){const tilt=.33;ctx.save();ctx.translate(cx,cy);ctx.rotate(-.23);for(let layer=0;layer<2;layer++){ctx.save();if(layer===1){ctx.beginPath();ctx.rect(-W,-H,W*2,H+0);ctx.clip();}for(let i=0;i<240*quality;i++){let angle=i/(240*quality)*PI+tick*(.045+(i%7)*.0007),rr=r*(1.16+(i%9)/9*1.42),x=Math.cos(angle)*rr,y=Math.sin(angle)*rr*tilt;let back=Math.sin(angle)<0;if((layer===0)!==back)continue;let warm=(Math.sin(angle+tick*.2)+1)/2,alpha=.035+.12*(1-Math.abs(rr/r-1.5)/2);ctx.strokeStyle='rgba('+(255)+','+Math.round(110+warm*100)+','+Math.round(42+warm*100)+','+Math.max(.01,alpha)+')';ctx.lineWidth=1.3+Math.sin(i*19)**2*2;ctx.beginPath();ctx.ellipse(0,0,rr,rr*tilt,0,angle,angle+.09);ctx.stroke();}ctx.restore();if(layer===0){let g=ctx.createRadialGradient(0,0,r*.96,0,0,r*1.33);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.24,'rgba(255,197,102,.45)');g.addColorStop(.5,'rgba(255,132,60,.12)');g.addColorStop(1,'rgba(255,80,55,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,r*1.36,r*.57,0,0,PI);ctx.fill();}}ctx.restore();}
function hole(){let halo=ctx.createRadialGradient(cx,cy,r*.9,cx,cy,r*1.72);halo.addColorStop(0,'rgba(255,235,190,.1)');halo.addColorStop(.22,'rgba(255,183,93,.22)');halo.addColorStop(.45,'rgba(225,106,56,.07)');halo.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,r*1.72,0,PI);ctx.fill();ctx.beginPath();ctx.arc(cx,cy,r,0,PI);ctx.fillStyle='#000';ctx.fill();ctx.strokeStyle='#f3c58b';ctx.globalAlpha=.65;ctx.lineWidth=Math.max(1,r*.017);ctx.stroke();ctx.globalAlpha=1;}
function frame(now){if(!document.hidden){const dt=Math.min(.04,(now-last)/1000||.016);last=now;if(playing)tick+=dt;background();disk();hole();}raf=requestAnimationFrame(frame)}document.getElementById('motion').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause motion':'Resume motion'};document.getElementById('quality').onclick=e=>{quality=quality===1?.5:quality===.5?1.5:1;e.target.textContent='Quality: '+(quality===1?'Auto':quality===.5?'Eco':'High')};document.getElementById('back').onclick=()=>location.href='./';addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>last=performance.now());resize();raf=requestAnimationFrame(frame)})();
</script></body></html>
