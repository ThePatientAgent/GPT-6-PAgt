<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project WOW | Web Test</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#182f5d,#050b1b 70%);color:white;font:16px system-ui,sans-serif}main{text-align:center;padding:24px;max-width:500px}.orb{width:140px;height:140px;margin:30px auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,#c8f8ff,#427de2 42%,#1a174e 78%);box-shadow:0 0 55px #518eff70;transition:transform .6s,filter .6s}button{padding:14px 24px;border:1px solid #89c6ff;border-radius:99px;background:#1e477d;color:white;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff}p{line-height:1.7;color:#d6e4ff}</style></head><body><main><h1>PROJECT WOW 🌌</h1><p>公開環境の動作確認</p><div id="orb" class="orb" aria-hidden="true"></div><button id="go" type="button">宇宙を動かす</button><p id="status" role="status">ボタンを押してください</p></main><script>let n=0;document.getElementById('go').addEventListener('click',()=>{n++;document.getElementById('orb').style.transform='rotate('+n*60+'deg) scale('+(n%2?1.25:1)+')';document.getElementById('orb').style.filter=n%2?'hue-rotate(80deg)':'none';document.getElementById('status').textContent='JavaScript 動作成功！ 操作回数: '+n;});</script></body></html>
