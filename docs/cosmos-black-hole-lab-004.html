<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMOS | Black Hole Lab</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#f0f2ff;font:14px system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;pointer-events:none}h1{font-size:18px;letter-spacing:.22em;font-weight:500;margin:0 0 7px}p{margin:0;color:#b2b8d0;font-size:12px}.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;white-space:nowrap}button{background:#151b30bb;color:#eef;border:1px solid #68759a88;border-radius:24px;padding:11px 15px;font:inherit;backdrop-filter:blur(8px)}.note{position:absolute;top:max(90px,calc(env(safe-area-inset-top) + 70px));left:20px;max-width:270px;font-size:12px;line-height:1.6;color:#a8b0cd;pointer-events:none}.tag{position:absolute;right:15px;top:25px;color:#7e8eaf;font-size:10px;letter-spacing:.14em}
</style></head><body><canvas id="c"></canvas><header><h1>COSMOS / BLACK HOLE</h1><p>Asymmetric light · lensing study</p></header><div class="tag">LAB 004</div><div class="note">A stylized flowing accretion disk with a simplified lensed light arc. Not a scientific ray-tracing simulation.</div><div class="controls"><button id="motion">Pause motion</button><button id="quality">Quality: Auto</button><button id="back">COSMOS ↗</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,stars=[],tick=0,last=0,playing=true,quality=1,raf=0;const PI=Math.PI*2;let cx=0,cy=0,r=100;const rnd=(seed)=>{let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296};function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);cx=W/2;cy=H*.51;r=Math.min(W*.16,H*.205,155);stars=[];const count=Math.min(800,Math.floor(W*H/950));for(let i=0;i<count;i++)stars.push({x:rnd(i*73+5)*W,y:rnd(i*119+11)*H,a:.15+rnd(i*31+9)*.75,z:.35+rnd(i*41+3)*1.1});}function background(){ctx.fillStyle='#02040d';ctx.fillRect(0,0,W,H);const haze=ctx.createRadialGradient(cx,cy,r*.9,cx,cy,r*5);haze.addColorStop(0,'#2a1430');haze.addColorStop(.35,'#0a0a21');haze.addColorStop(1,'#02040d');ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);for(const s of stars){let dx=s.x-cx,dy=s.y-cy,dist=Math.hypot(dx,dy),sx=s.x,sy=s.y;if(dist<r*3.4&&dist>r*.94){let deflect=r*r*.45/(dist*dist+.1);sx+=dx*deflect;sy+=dy*deflect;}if(dist<r*1.04)continue;ctx.globalAlpha=s.a;ctx.fillStyle='#d9e6ff';ctx.fillRect(sx,sy,s.z,s.z)}ctx.globalAlpha=1;}
function bandPath(radius,flatten,phase,extent,alpha,width,hue){
ctx.beginPath();ctx.ellipse(0,0,radius,radius*flatten,0,phase,phase+extent);
ctx.strokeStyle='hsla('+hue+',100%,73%,'+alpha+')';ctx.lineWidth=width;ctx.stroke();
}
function disk(){
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.22);
const N=quality===.5?70:quality===1?125:185,tilt=.31;
for(let pass=0;pass<2;pass++){
ctx.save();
ctx.beginPath();ctx.rect(-W,pass===0?-H:0,W*2,H);ctx.clip();
for(let j=0;j<11;j++){
let rr=r*(1.15+j*.128),alpha=(.10+.16*(1-j/13));
bandPath(rr,tilt,0,PI*2,alpha,2.5+j*.45,26+j*1.3);
}
for(let i=0;i<N;i++){
let radius=r*(1.16+1.52*(i+.5)/N);
let angle=i*2.3999632297+tick*(1.15/Math.pow(radius/r,1.35));
let glow=.55+.45*Math.sin(i*2.73+tick*.8);
let length=.45+.38*Math.sin(i*3.31)**2;
let width=(2.1+3.2*glow)*(1.3-(radius/r-1.16)*.27);
bandPath(radius,tilt,angle,length,.10+.24*glow,width,19+25*glow);
}
ctx.restore();
}
ctx.restore();
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.22);
for(let j=0;j<15;j++){
const rad=r*(1.19+j*.085);
ctx.beginPath();ctx.ellipse(0,0,rad,rad*.31,0,.06,2.4);
ctx.strokeStyle='rgba(255,235,174,'+(.15*(1-j/17))+')';
ctx.lineWidth=2.2;ctx.stroke();
}
ctx.restore();
}
function lens(){
ctx.save();ctx.translate(cx,cy);
ctx.rotate(-.22);
const N=quality===.5?38:quality===1?66:90;
for(let i=0;i<N;i++){
const angle=i*2.399963+tick*(.28+(i%5)*.025);
const size=r*(1.065+.14*(i%13)/13);
const brightness=.4+.6*Math.sin(i*4.8+tick*.7)**2;
ctx.beginPath();
ctx.ellipse(0,-r*.045,size,size*.99,0,Math.PI*1.06+angle*.08,Math.PI*1.94+angle*.08);
ctx.strokeStyle='rgba(255,'+Math.round(142+brightness*78)+','+Math.round(75+brightness*80)+','+(.018+.028*brightness)+')';
ctx.lineWidth=1.1+brightness*1.4;ctx.stroke();
}
ctx.beginPath();ctx.ellipse(0,-r*.045,r*1.105,r*1.07,0,Math.PI*1.08,Math.PI*1.94);
ctx.strokeStyle='rgba(255,210,154,.33)';ctx.lineWidth=r*.055;ctx.stroke();
ctx.restore();
}
function hole(){
let halo=ctx.createRadialGradient(cx,cy,r*.94,cx,cy,r*1.75);
halo.addColorStop(0,'rgba(255,211,145,.15)');
halo.addColorStop(.2,'rgba(255,155,70,.19)');
halo.addColorStop(.55,'rgba(230,83,43,.05)');
halo.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,r*1.75,0,PI);ctx.fill();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,r,0,PI);ctx.fill();
ctx.strokeStyle='rgba(255,205,147,.7)';ctx.lineWidth=Math.max(1.3,r*.021);ctx.stroke();
}
function frame(now){if(!document.hidden){const dt=Math.min(.04,(now-last)/1000||.016);last=now;if(playing)tick+=dt*1.65;background();disk();hole();lens();}raf=requestAnimationFrame(frame)}document.getElementById('motion').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause motion':'Resume motion'};document.getElementById('quality').onclick=e=>{quality=quality===1?.5:quality===.5?1.5:1;e.target.textContent='Quality: '+(quality===1?'Auto':quality===.5?'Eco':'High')};document.getElementById('back').onclick=()=>location.href='./';addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>last=performance.now());resize();raf=requestAnimationFrame(frame)})();
</script></body></html>
