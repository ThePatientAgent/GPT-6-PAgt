<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMOS — 動画再生</title><style>html,body{margin:0;background:#030711;color:#fff;font-family:-apple-system,system-ui,sans-serif}main{max-width:540px;margin:auto;padding:12px}video{display:block;width:100%;max-height:80dvh;background:#000;object-fit:contain;border-radius:12px}button,a{display:block;box-sizing:border-box;width:100%;margin-top:12px;padding:16px;border-radius:12px;text-align:center;font-size:17px;font-weight:bold}button{background:#3279ed;color:white;border:0}a{background:#202b40;color:white;text-decoration:none}p{color:#b4c3dc;font-size:14px}</style></head><body><main><video id="v" controls playsinline webkit-playsinline preload="metadata" poster="./media/cosmos-clean-clock-sample.jpg"><source src="./media/cosmos-iphone-compatible-30fps.mp4" type="video/mp4">動画に対応していません。</video><button id="play">▶ 動画を再生する</button><a href="./media/cosmos-iphone-compatible-30fps.mp4" download="COSMOS_IPHONE_30FPS.mp4">動画ファイルを開く・保存</a><p id="status">iPhoneでは上の再生ボタンをタップしてください。</p></main><script>const v=document.getElementById('v'),s=document.getElementById('status');document.getElementById('play').onclick=async()=>{try{await v.play();s.textContent='再生中'}catch(e){s.textContent='再生できません: '+e.message}};v.onerror=()=>s.textContent='動画を読み込めません。下の「動画ファイルを開く・保存」をお試しください。';</script></body></html>
