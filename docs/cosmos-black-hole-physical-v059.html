<script>
(()=>{'use strict';
 const CAN=document.getElementById('scene'),G=CAN.getContext('2d',{alpha:false});
 const W=420,H=420,N=30,COLS=5,PERIOD=5400;
 CAN.width=W;CAN.height=H;
 const atlas=new Image();
 let ready=false,paused=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 let pauseStart=0,pauseOffset=0,started=0,raf=0;
 const btn=document.getElementById('motion'),status=document.getElementById('status');
 function updateButton(){btn.textContent=paused?'▶ Play motion':'Ⅱ Pause motion';btn.setAttribute('aria-pressed',String(!paused));}
 updateButton();
 function draw(ms){
   if(!ready)return;
   if(!started)started=ms;
   if(paused){pauseStart=ms;return;}
   const cycle=((ms-started-pauseOffset)%PERIOD+PERIOD)%PERIOD/PERIOD*N;
   const f0=Math.floor(cycle),f1=(f0+1)%N,k=cycle-f0;
   const sx0=(f0%COLS)*W,sy0=Math.floor(f0/COLS)*H;
   const sx1=(f1%COLS)*W,sy1=Math.floor(f1/COLS)*H;
   G.globalAlpha=1;G.drawImage(atlas,sx0,sy0,W,H,0,0,W,H);
   if(k>.015){G.globalAlpha=k;G.drawImage(atlas,sx1,sy1,W,H,0,0,W,H);G.globalAlpha=1;}
   raf=requestAnimationFrame(draw);
 }
 btn.addEventListener('click',()=>{
    paused=!paused;updateButton();
    if(paused){cancelAnimationFrame(raf);pauseStart=performance.now();}
    else if(ready){pauseOffset+=pauseStart?performance.now()-pauseStart:0;pauseStart=0;raf=requestAnimationFrame(draw);}
 });
 function stop(){cancelAnimationFrame(raf);}
 function resume(){if(ready&&!paused){if(pauseStart)pauseOffset+=performance.now()-pauseStart;pauseStart=0;raf=requestAnimationFrame(draw);}}
 document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();pauseStart=performance.now();}else resume()});
 atlas.onload=()=>{
  if(!atlas.naturalWidth)return;
  ready=true;G.drawImage(atlas,0,0,W,H,0,0,W,H);
  document.getElementById('poster').style.display='none';
  status.textContent=paused?'MOTION READY · Press Play':'LIVE ACCRETION FLOW';
  if(!paused)raf=requestAnimationFrame(draw);
