<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMOS | Black Hole Lab</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#f0f2ff;font:14px system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;pointer-events:none}h1{font-size:18px;letter-spacing:.22em;font-weight:500;margin:0 0 7px}p{margin:0;color:#b2b8d0;font-size:12px}.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;white-space:nowrap}button{background:#151b30bb;color:#eef;border:1px solid #68759a88;border-radius:24px;padding:11px 15px;font:inherit;backdrop-filter:blur(8px)}.note{position:absolute;top:max(90px,calc(env(safe-area-inset-top) + 70px));left:20px;max-width:270px;font-size:12px;line-height:1.6;color:#a8b0cd;pointer-events:none}.tag{position:absolute;right:15px;top:25px;color:#7e8eaf;font-size:10px;letter-spacing:.14em}
</style></head><body><canvas id="c"></canvas><header><h1>COSMOS / BLACK HOLE</h1><p>Cinematic reboot · volumetric plasma</p></header><div class="tag">LAB 025</div><div class="note">A flowing disk with upper and lower light paths around the shadow. Not a scientific ray-tracing simulation.</div><div class="controls"><button id="motion">Pause motion</button><button id="quality">Quality: Auto</button><button id="back">COSMOS ↗</button></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,D=1,stars=[],tick=0,last=0,playing=true,quality=1,raf=0;const PI=Math.PI*2;let cx=0,cy=0,r=100;const rnd=(seed)=>{let t=seed+0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296};function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);cx=W/2;cy=H*.51;r=Math.min(W*.16,H*.205,155);stars=[];const count=Math.min(800,Math.floor(W*H/950));for(let i=0;i<count;i++)stars.push({x:rnd(i*73+5)*W,y:rnd(i*119+11)*H,a:.15+rnd(i*31+9)*.75,z:.35+rnd(i*41+3)*1.1});}function background(){ctx.fillStyle='#02040d';ctx.fillRect(0,0,W,H);const haze=ctx.createRadialGradient(cx,cy,r*.9,cx,cy,r*5);haze.addColorStop(0,'#2a1430');haze.addColorStop(.35,'#0a0a21');haze.addColorStop(1,'#02040d');ctx.fillStyle=haze;ctx.fillRect(0,0,W,H);for(const s of stars){let dx=s.x-cx,dy=s.y-cy,dist=Math.hypot(dx,dy),sx=s.x,sy=s.y;if(dist<r*3.4&&dist>r*.94){let deflect=r*r*.45/(dist*dist+.1);sx+=dx*deflect;sy+=dy*deflect;}if(dist<r*1.04)continue;ctx.globalAlpha=s.a;ctx.fillStyle='#d9e6ff';ctx.fillRect(sx,sy,s.z,s.z)}ctx.globalAlpha=1;}
function bandPath(radius,flatten,phase,extent,alpha,width,hue){
ctx.beginPath();ctx.ellipse(0,0,radius,radius*flatten,0,phase,phase+extent);
ctx.strokeStyle='hsla('+hue+',100%,73%,'+alpha+')';ctx.lineWidth=width;ctx.stroke();
}
function disk(front){
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.22);
const bands=quality===.5?20:quality===1?34:48;
const steps=quality===.5?70:110;
for(let i=bands-1;i>=0;i--){
const t=(i+.5)/bands,rad=r*(1.04+1.82*t);
const width=r*(.13+.06*t);
for(let k=0;k<steps;k++){
const th=Math.PI*(front?0:1)+Math.PI*(k+.5)/steps;
const sn=Math.sin(th),co=Math.cos(th),x=rad*co;
const seam=Math.pow(Math.abs(sn),.65);
const warp=front?0:-r*(.78+.20*(1-t))*Math.exp(-Math.pow(x/(r*(1.36+.40*t)),2))*seam;
const jitter=r*(.022+.016*t)*Math.sin(th*8+i*1.9+tick*.65)*Math.sin(th*17-i*.8-tick*.4)*seam;
const y=rad*.34*sn+warp+jitter;
const edge=Math.pow(Math.max(0,Math.min(1,(rad/r-1.04)/.28)),.6);
const tail=Math.pow(Math.abs(sn),.23);
const noise=.52+.48*Math.sin(i*1.73+th*11+tick*(.5+.2*(1-t)))**2;
const alpha=(.032+.12*(1-t))*noise*edge*(.55+.45*tail);
ctx.beginPath();ctx.ellipse(x,y,width*(1+.25*noise),r*(.05+.035*noise),-.22,0,Math.PI*2);
ctx.fillStyle=x<0?'rgba(255,231,164,'+(alpha*1.55)+')':'rgba(255,125,54,'+(alpha*.88)+')';
ctx.fill();
}
}
const wisps=quality===.5?40:quality===1?75:115;
for(let i=0;i<wisps;i++){
const t=((i*.61803398875)%1),rad=r*(1.1+1.75*t);
const start=Math.PI*(front?0:1)+((i*2.399963+tick*(.18+.52*(1-t)))%Math.PI);
ctx.beginPath();let started=false;
for(let k=0;k<13;k++){
const th=start+k*.042;
if(th>Math.PI*(front?1:2))break;
const sn=Math.sin(th),x=rad*Math.cos(th);
const warp=front?0:-r*(.78+.20*(1-t))*Math.exp(-Math.pow(x/(r*(1.36+.40*t)),2))*Math.pow(Math.abs(sn),.65);
const y=rad*.34*sn+warp+r*.02*Math.sin(th*13+i+tick)*Math.abs(sn);
if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
}
ctx.strokeStyle=i%3===0?'rgba(255,244,192,.18)':'rgba(255,146,67,.10)';
ctx.lineWidth=1.1+2*(1-t);ctx.stroke();
}
ctx.restore();
}
function hole(){
const halo=ctx.createRadialGradient(cx,cy,r*.80,cx,cy,r*1.5);
halo.addColorStop(0,'rgba(255,180,83,.08)');halo.addColorStop(.35,'rgba(255,135,59,.16)');halo.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,r*1.5,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,r*.94,0,Math.PI*2);ctx.fill();
ctx.save();ctx.translate(cx,cy);ctx.rotate(-.22);
const light=ctx.createLinearGradient(-r*1.8,0,r*1.8,0);
light.addColorStop(0,'rgba(255,248,201,.68)');light.addColorStop(.5,'rgba(255,191,103,.46)');light.addColorStop(1,'rgba(237,99,51,.26)');
for(let i=0;i<13;i++){
const t=i/12;
ctx.beginPath();ctx.moveTo(r*(1.52+.16*t),r*.08);
ctx.bezierCurveTo(r*1.2,r*(.65+.14*t),r*.65,r*(1.14+.18*t),0,r*(1.13+.20*t));
ctx.bezierCurveTo(-r*.65,r*(1.14+.18*t),-r*1.2,r*(.65+.14*t),-r*(1.52+.16*t),r*.08);
ctx.strokeStyle=light;ctx.globalAlpha=.17*(1-t);ctx.lineWidth=r*.035;ctx.stroke();
}
ctx.globalAlpha=1;ctx.restore();
}
function frame(now){if(!document.hidden){const dt=Math.min(.04,(now-last)/1000||.016);last=now;if(playing)tick+=dt*1.65;background();disk(false);hole();disk(true);}raf=requestAnimationFrame(frame)}document.getElementById('motion').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause motion':'Resume motion'};document.getElementById('quality').onclick=e=>{quality=quality===1?.5:quality===.5?1.5:1;e.target.textContent='Quality: '+(quality===1?'Auto':quality===.5?'Eco':'High')};document.getElementById('back').onclick=()=>location.href='./';addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>last=performance.now());resize();raf=requestAnimationFrame(frame)})();
</script></body></html>
