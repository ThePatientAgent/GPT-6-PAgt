<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050917"><title>COSMOS 3D · Project WOW</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050917;color:#f2f6ff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior-y:contain}main{max-width:1100px;margin:auto;padding:18px 12px 32px}.head{display:flex;align-items:center;justify-content:space-between;color:#a6bfdc;font-size:11px;letter-spacing:.14em;padding:4px 8px}.tag{border:1px solid #708aa75c;border-radius:30px;padding:7px 11px}h1{font-size:clamp(30px,7vw,56px);margin:19px 8px 4px;letter-spacing:-.055em}p{margin:0 8px 15px;color:#a7b9d3;font-size:13px;line-height:1.6}.viewport{height:min(77dvh,760px);min-height:440px;position:relative;border-radius:22px;overflow:hidden;border:1px solid #5b8bb74d;background:radial-gradient(circle at 50% 45%,#172246,#050917 68%);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}.viewport:active{cursor:grabbing}.nebula{position:absolute;inset:0;pointer-events:none;opacity:.72;mix-blend-mode:screen;background:radial-gradient(ellipse 55% 37% at 47% 51%,#9c4b9333 0%,#293e9e1a 55%,transparent 85%),radial-gradient(ellipse 48% 42% at 60% 46%,#4c93cc27 0%,transparent 80%);filter:blur(22px);animation:nebulaDrift 19s ease-in-out infinite alternate}@keyframes nebulaDrift{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.22) rotate(5deg)}}@media(prefers-reduced-motion:reduce){.nebula{animation:none}}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;pointer-events:none;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.instruction{text-align:center;font-size:12px;color:#d0e5f5;text-shadow:0 2px 12px black}.bottom{display:flex;justify-content:space-between;align-items:end;gap:12px}.metric{background:#071426a8;border:1px solid #a5bedc36;border-radius:12px;padding:9px 12px;backdrop-filter:blur(9px);font-size:12px;color:#dce9fb}.metric strong{display:block;color:#fff;font-size:15px;margin-top:3px}.note{font-size:11px;text-align:center;margin-top:14px;color:#869bb9}@media(max-width:550px){.viewport{height:74dvh;min-height:490px}.overlay{padding:12px}.instruction{font-size:11px}.metric{font-size:10px}.metric strong{font-size:12px}}</style></head><body><main><div class="head"><span>THE PATIENT AGENT · PROJECT WOW</span><span class="tag">3D LAB · 005</span></div><h1>宇宙に、入る。</h1><p>銀河を抜けて恒星へ。近づいても通り過ぎず、恒星系をじっくり探索できる。</p><div class="viewport" id="stage" tabindex="0" aria-label="3D宇宙。上下ドラッグでズーム、左右ドラッグで時間を変える。矢印キーでも操作可能"><canvas id="canvas"></canvas><div class="nebula" aria-hidden="true"></div><div class="overlay"><div class="instruction">← 時間 →　　↑ 宇宙へ入る ↓</div><div class="bottom"><div class="metric">宇宙の時間<strong id="time">68%</strong></div><div class="metric">カメラ深度<strong id="depth">0%</strong></div><div class="metric">描画<strong id="mode">3D / WebGL</strong></div></div></div></div><div class="note">恒星への接近と惑星系の出現を加えた3D技術実験。天体の位置・縮尺・宇宙史を正確に再現したものではありません。<br>Independent human–AI project · Not OpenAI</div></main><script>
'use strict';const stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),timeEl=document.getElementById('time'),depthEl=document.getElementById('depth'),modeEl=document.getElementById('mode');let time=.68,depth=0,visualDepth=0,visualTime=.68,last=null,active=true,W=1,H=1,scale=1;const clamp=v=>Math.max(0,Math.min(1,v));const hash=n=>{let x=Math.sin(n*127.1+14.3)*43758.5453;return x-Math.floor(x)};const count=10500,positions=new Float32Array(count*3),colors=new Float32Array(count*3),sizes=new Float32Array(count),born=new Float32Array(count);for(let i=0;i<count;i++){const a=i*2.399963+hash(i+55)*.25,r=Math.sqrt(hash(i+19)),arm=i%3,ang=a*.13+arm*2.094+r*6.5,rad=r*4.4;positions[i*3]=Math.cos(ang)*rad+(hash(i+100)-.5)*.28;positions[i*3+1]=(hash(i+222)-.5)*(.22+.6*r);positions[i*3+2]=Math.sin(ang)*rad+(hash(i+333)-.5)*.28;const warmth=hash(i+10);colors[i*3]=warmth>.92?1:.4+hash(i+15)*.3;colors[i*3+1]=warmth>.92?.77:.6+hash(i+16)*.3;colors[i*3+2]=warmth>.92?.55:1;sizes[i]=.5+hash(i+3)*3.0;born[i]=.12+hash(i+81)*.75}
const destination={x:.18,y:.02,z:1.22};const planets=[{r:.44,size:.027,color:[.65,.75,1]},{r:.69,size:.043,color:[1,.64,.32]},{r:1.02,size:.067,color:[.38,.72,1]},{r:1.45,size:.052,color:[.85,.78,.62]}];const systemCount=1+planets.length;const systemPos=new Float32Array(systemCount*3),systemCol=new Float32Array(systemCount*3),systemSize=new Float32Array(systemCount),systemBorn=new Float32Array(systemCount);systemPos.set([destination.x,destination.y,destination.z],0);systemCol.set([1,.82,.5],0);systemSize[0]=8;systemBorn[0]=.18;for(let i=0;i<planets.length;i++){const p=planets[i];systemCol.set(p.color,(i+1)*3);systemSize[i+1]=p.size*25;systemBorn[i+1]=.42+i*.08}let systemBuffers=[],starBuffers=[];const gl=canvas.getContext('webgl',{antialias:false,alpha:false,powerPreference:'high-performance'});let program,bufPos,bufCol,bufBorn,bufSize,loc={};if(gl){const vs='attribute vec3 aPosition;attribute vec3 aColor;attribute float aBorn;attribute float aSize;uniform float uDepth;uniform float uTime;uniform float uAspect;uniform float uClock;uniform float uSystem;varying vec3 vColor;varying float vAlpha;void main(){float a=uClock*.015;float ca=cos(a),sa=sin(a);vec3 p=aPosition;if(uSystem>.5){p=aPosition;}else{p.xz=mat2(ca,-sa,sa,ca)*p.xz;}float cam=12.0-min(uDepth,.84)*10.7;float z=cam-p.z;float perspective=2.4/max(z,.25);vec2 xy=vec2(p.x,p.y)*perspective;gl_Position=vec4(xy.x/uAspect,xy.y,0.,1.);gl_PointSize=clamp(aSize*perspective*(uSystem>.5?16.0:9.0),1.0,uSystem>.5?240.0:42.0);vColor=aColor;vAlpha=smoothstep(aBorn-.08,aBorn+.08,uTime)*smoothstep(.15,.8,uTime);if(uSystem>.5)vAlpha*=smoothstep(.43,.68,uDepth);else vAlpha*=1.0-smoothstep(.49,.69,uDepth);if(z<=.25||z>24.){gl_Position=vec4(2.,2.,0.,1.);vAlpha=0.;}}';const fs='precision mediump float;varying vec3 vColor;varying float vAlpha;void main(){vec2 p=gl_PointCoord*2.-1.;float r=length(p);float halo=exp(-r*r*3.8)*.27;float core=exp(-r*r*31.)*1.35;float a=(halo+core)*vAlpha;if(a<.008)discard;vec3 rgb=mix(vColor,vec3(1.0,.96,.86),clamp(core*.32,0.,.42));gl_FragColor=vec4(rgb*a,a);}';function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);function attrib(name,values,n){const b=gl.createBuffer();starBuffers.push(b);gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);const l=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,n,gl.FLOAT,false,0,0)}attrib('aPosition',positions,3);attrib('aColor',colors,3);attrib('aBorn',born,1);attrib('aSize',sizes,1);for(const n of ['uDepth','uTime','uAspect','uClock','uSystem'])loc[n]=gl.getUniformLocation(program,n);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.disable(gl.DEPTH_TEST);const sys=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,sys);gl.bufferData(gl.ARRAY_BUFFER,systemPos,gl.DYNAMIC_DRAW);systemBuffers.push(sys);for(const [name,values] of [['aColor',systemCol],['aBorn',systemBorn],['aSize',systemSize]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);systemBuffers.push(b)}}catch(e){modeEl.textContent='WebGL error';console.error(e);program=null}}else{modeEl.textContent='WebGL unavailable'}const fallback=gl?null:canvas.getContext('2d');function resize(){scale=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=Math.floor(W*scale);canvas.height=Math.floor(H*scale);if(gl)gl.viewport(0,0,canvas.width,canvas.height);else if(fallback)fallback.setTransform(scale,0,0,scale,0,0)}function render(t){if(!active)return;visualDepth+=(depth-visualDepth)*.085;visualTime+=(time-visualTime)*.085;if(gl&&program){gl.clearColor(.008,.014,.042,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(program);gl.uniform1f(loc.uDepth,visualDepth);gl.uniform1f(loc.uTime,visualTime);gl.uniform1f(loc.uAspect,W/H);gl.uniform1f(loc.uClock,t*.001);gl.uniform1f(loc.uSystem,0);if(visualDepth<.70)gl.drawArrays(gl.POINTS,0,count);if(visualDepth>.40){const phase=t*.00011;for(let i=0;i<planets.length;i++){const p=planets[i],a=phase*(1.5-i*.22)+i*1.75;systemPos[(i+1)*3]=destination.x+Math.cos(a)*p.r;systemPos[(i+1)*3+1]=destination.y+Math.sin(a*.7)*.12;systemPos[(i+1)*3+2]=destination.z+Math.sin(a)*p.r*.5}for(const [j,name] of ['aPosition','aColor','aBorn','aSize'].entries()){const l=gl.getAttribLocation(program,name);gl.bindBuffer(gl.ARRAY_BUFFER,systemBuffers[j]);if(j===0)gl.bufferSubData(gl.ARRAY_BUFFER,0,systemPos);gl.vertexAttribPointer(l,j===1||j===0?3:1,gl.FLOAT,false,0,0)}gl.uniform1f(loc.uSystem,1);gl.drawArrays(gl.POINTS,0,systemCount);for(const [j,name] of ['aPosition','aColor','aBorn','aSize'].entries()){const l=gl.getAttribLocation(program,name);gl.bindBuffer(gl.ARRAY_BUFFER,starBuffers[j]);gl.vertexAttribPointer(l,j===1||j===0?3:1,gl.FLOAT,false,0,0)}}}else if(fallback){fallback.fillStyle='#050917';fallback.fillRect(0,0,W,H);for(let i=0;i<550;i++){if(born[i]>visualTime||visualDepth>.69)continue;const z=12-Math.min(visualDepth,.84)*10.7-positions[i*3+2],p=2.4/Math.max(z,.25);if(z<=.25)continue;const x=W/2+positions[i*3]*p*H/2,y=H/2+positions[i*3+1]*p*H/2;fallback.fillStyle='#a9c8ff';fallback.globalAlpha=(.2+hash(i)*.7)*(1-Math.max(0,Math.min(1,(visualDepth-.49)/.20)));fallback.beginPath();fallback.arc(x,y,Math.max(.5,sizes[i]*p*2),0,6.283);fallback.fill()}fallback.globalAlpha=1}requestAnimationFrame(render)}function update(){timeEl.textContent=Math.round(time*100)+'%';depthEl.textContent=(depth>.84?'恒星系を観察':Math.round(depth*100)+'%')}function move(x,y){if(!last)return;const r=stage.getBoundingClientRect();time=clamp(time+3.1*(x-last.x)/r.width);depth=clamp(depth-2.2*(y-last.y)/r.height);last={x,y,id:last.id};update()}stage.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();if(!last&&e.changedTouches.length){const p=e.changedTouches[0];last={x:p.clientX,y:p.clientY,id:p.identifier}}},{passive:false});stage.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();if(!last)return;for(const p of e.changedTouches)if(p.identifier===last.id){move(p.clientX,p.clientY);break}},{passive:false});function stopTouch(e){if(e.cancelable)e.preventDefault();for(const p of e.changedTouches)if(last&&p.identifier===last.id)last=null}stage.addEventListener('touchend',stopTouch,{passive:false});stage.addEventListener('touchcancel',stopTouch,{passive:false});stage.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.button!==0)return;stage.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY,id:e.pointerId}});stage.addEventListener('pointermove',e=>{if(e.pointerType!=='touch'&&last&&last.id===e.pointerId)move(e.clientX,e.clientY)});stage.addEventListener('pointerup',()=>last=null);stage.addEventListener('pointercancel',()=>last=null);stage.addEventListener('keydown',e=>{const s=e.shiftKey?.08:.025;if(e.key==='ArrowLeft')time=clamp(time-s);else if(e.key==='ArrowRight')time=clamp(time+s);else if(e.key==='ArrowUp')depth=clamp(depth+s);else if(e.key==='ArrowDown')depth=clamp(depth-s);else return;e.preventDefault();update()});window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{active=!document.hidden;if(active)requestAnimationFrame(render)});resize();update();requestAnimationFrame(render);
