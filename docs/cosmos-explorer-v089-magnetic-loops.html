.solar-sun .cosmos-v088-arcs{opacity:0!important}

.solar-sun .cosmos-v089-strand.l3{animation-delay:-3.8s;animation-duration:6.4s}
@keyframes cosmos-v089-stream{0%{stroke-dashoffset:180;opacity:.04}28%{stroke-dashoffset:95;opacity:.95}70%{stroke-dashoffset:0;opacity:.85}100%{stroke-dashoffset:-180;opacity:.05}}

`;
