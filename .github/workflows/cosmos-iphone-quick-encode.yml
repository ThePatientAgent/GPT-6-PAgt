name: COSMOS iPhone quick compatibility encode
on:
  push:
    paths:
      - .github/workflows/cosmos-iphone-quick-encode.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Encode existing captured frames for iPhone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p docs/media
          test -s docs/media/cosmos-clean-viewport-clock-30fps.mp4
          ffmpeg -hide_banner -nostdin -loglevel warning -y -i docs/media/cosmos-clean-viewport-clock-30fps.mp4 -map 0:v:0 -an -c:v libx264 -preset medium -profile:v baseline -level:v 3.1 -pix_fmt yuv420p -bf 0 -refs 1 -crf 20 -maxrate 2600k -bufsize 5200k -g 60 -movflags +faststart docs/media/cosmos-iphone-compatible-30fps.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,level,pix_fmt,width,height,avg_frame_rate,nb_frames:format=duration,size -of default=noprint_wrappers=1 docs/media/cosmos-iphone-compatible-30fps.mp4 > docs/media/cosmos-iphone-compatible-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/cosmos-iphone-compatible-30fps.mp4 docs/media/cosmos-iphone-compatible-report.txt
          git commit -m "Publish iPhone-compatible COSMOS MP4" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
