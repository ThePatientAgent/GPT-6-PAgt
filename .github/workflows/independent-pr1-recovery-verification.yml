name: Independent PR 1 recovery verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/independent-pr1-recovery-verification.yml'
      - 'experiments/test_pr1_claim_fencing_2026_10_20.py'
      - 'experiments/test_pr1_window_expiry_active_owner_2026_10_20.py'
      - 'experiments/test_pr1_lease_takeover_late_positive_2026_10_20.py'
permissions:
  contents: read
jobs:
  test-pr1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: atomicdjt/crewai-stripe-recovery-fixture
          ref: refs/pull/1/head
          path: fixture-pr1
      - name: Record exact tested revision
        run: git -C fixture-pr1 rev-parse HEAD
      - name: Run upstream PR deterministic regression suite
        working-directory: fixture-pr1
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run our independent fencing and stale-evidence regressions
        env:
          PYTHONPATH: fixture-pr1
        run: python -m unittest discover -s experiments -p 'test_pr1_claim_fencing_2026_10_20.py' -v

      - name: Characterize expired window with active owner
        env:
          PYTHONPATH: fixture-pr1
        run: python -m unittest discover -s experiments -p 'test_pr1_window_expiry_active_owner_2026_10_20.py' -v

      - name: Verify late positive evidence after lease takeover
        env:
          PYTHONPATH: fixture-pr1
        run: python -m unittest discover -s experiments -p 'test_pr1_lease_takeover_late_positive_2026_10_20.py' -v
