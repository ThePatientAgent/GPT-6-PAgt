name: COSMOS V13 deployed-browser smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cosmos-v13-live-smoke.yml
      - docs/index.html
      - docs/cosmos-black-hole-radiance-v013.html
      - docs/cosmos-explorer-v069-no-title-card-base.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser driver
        run: python -m pip install playwright==1.58.0
      - name: Validate deployed V13 in both routes
        shell: bash
        run: |
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright

          SITE = "https://thepatientagent.github.io/GPT-6-PAgt"
          expected = "cosmos-black-hole-radiance-v013.html"

          def snapshot(canvas):
              return canvas.evaluate("""el => ({
                  document: el.ownerDocument.URL,
                  ready: el.dataset.ready,
                  renderer: el.dataset.renderer,
                  radiance: el.dataset.radiance,
                  geometry: el.dataset.geometry,
                  prepared: el.dataset.prepared,
                  phase: el.dataset.phase,
                  canvases: el.ownerDocument.querySelectorAll('canvas').length
              })""")

          def validate(canvas, route):
              canvas.wait_for(state="attached", timeout=115000)
              data = snapshot(canvas)
              assert expected in data["document"], f"{route}: wrong iframe source {data}"
              assert data["ready"] == "true", f"{route}: not ready {data}"
              assert data["renderer"] == "canvas2d-radiant-plasma", f"{route}: V13 lost {data}"
              assert data["radiance"] == "source-synchronous", f"{route}: desynchronized glow {data}"
              assert data["geometry"] == "identity", f"{route}: warped geometry {data}"
              assert data["prepared"] == "48", f"{route}: missing frames {data}"
              assert data["canvases"] == 1, f"{route}: unexpected playback canvases {data}"
              p1 = data["phase"]
              time.sleep(1.3)
              p2 = snapshot(canvas)["phase"]
              assert p1 is not None and p2 is not None and p1 != p2, f"{route}: animation stalled {p1}, {p2}"
              print(f"PASS {route}: {data}; advanced phase {p1} -> {p2}", flush=True)

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome", headless=True,
                                                   args=["--no-sandbox", "--disable-dev-shm-usage"])
              context = browser.new_context(viewport={"width":390,"height":844},
                                            device_scale_factor=2, is_mobile=True, has_touch=True,
                                            reduced_motion="no-preference")
              manual = context.new_page()
              manual.goto(SITE + "/index.html?scene=black-hole&release=575cf6c",
                          wait_until="domcontentloaded", timeout=90000)
              validate(manual.frame_locator("#cosmos-bh-frame-v057").locator("#scene[data-ready='true']"),
                       "manual")

              tour = context.new_page()
              tour.goto(SITE + "/index.html?release=575cf6c",
                        wait_until="domcontentloaded", timeout=90000)
              inner = tour.frame_locator("#cosmos")
              trigger = inner.locator("#tourToggle")
              trigger.wait_for(state="attached", timeout=90000)
              trigger.evaluate("button => button.click()")
              tour_canvas = inner.frame_locator("#cosmos-hole-visit-frame").locator("#scene[data-ready='true']")
              validate(tour_canvas, "guided stop 3 of 6")
              stage = inner.locator("#tourStep").inner_text(timeout=15000)
              destination = inner.locator("#tourName").inner_text(timeout=15000)
              assert "3" in stage and "Black Hole" in destination, (stage, destination)
              print("PASS guided tour stop label:", stage, destination, flush=True)
              context.close()
              browser.close()
          PY
