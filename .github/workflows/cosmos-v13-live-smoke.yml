name: COSMOS V13 deployed-browser smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cosmos-v13-live-smoke.yml
      - tools/cosmos-sun-v207-smoke.cjs
      - docs/index.html
      - docs/cosmos-explorer-v085-final-no-sirius.html
      - docs/cosmos-sun-v207.js
      - docs/cosmos-rich-scenes-v211.js
      - docs/cosmos-worlds-v212.js
      - docs/cosmos-stellar-backdrop-v218.js
      - tools/cosmos-orbits-v212-test.cjs
      - tools/cosmos-bh-v213-smoke.cjs
      - docs/media/cosmos-v13-radiance-atlas-v213.webp
      - docs/cosmos-black-hole-radiance-v013.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright@1.58.0
      - name: Validate the deployed five-stop tour
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, time, urllib.request
          base='https://thepatientagent.github.io/GPT-6-PAgt/'
          paths=['index.html','cosmos-explorer-v085-final-no-sirius.html','cosmos-sun-v207.js','cosmos-rich-scenes-v211.js','cosmos-stellar-backdrop-v218.js','cosmos-worlds-v212.js','cosmos-black-hole-radiance-v013.html','media/cosmos-v13-radiance-atlas-v213.webp']
          for attempt in range(60):
              try:
                  for path in paths:
                      with urllib.request.urlopen(base+path+'?verify='+os.environ['GITHUB_SHA']+'&attempt='+str(attempt),timeout=15) as response:
                          actual=response.read()
                      expected=pathlib.Path('docs',path).read_bytes()
                      if hashlib.sha256(actual).digest()!=hashlib.sha256(expected).digest():
                          raise RuntimeError(path+' is still the previous deployment')
                  print('Public bytes match this commit');break
              except Exception as error:
                  if attempt==59: raise
                  print('Waiting for Pages:',error,flush=True);time.sleep(5)
          PY
          node tools/cosmos-orbits-v212-test.cjs
          export COSMOS_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          node tools/cosmos-sun-v207-smoke.cjs \
            --url "https://thepatientagent.github.io/GPT-6-PAgt/?qa=${GITHUB_SHA}" \
            --output cosmos-sun-live-qa
          node tools/cosmos-bh-v213-smoke.cjs \
            --url "https://thepatientagent.github.io/GPT-6-PAgt/?realtime=${GITHUB_SHA}" \
            --output cosmos-bh-live-qa
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sun-live-qa
          path: |
            cosmos-sun-live-qa
            cosmos-bh-live-qa
          if-no-files-found: ignore
