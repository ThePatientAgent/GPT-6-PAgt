name: COSMOS V13 deployed-browser smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cosmos-v13-live-smoke.yml
      - tools/cosmos-sun-v207-smoke.cjs
      - docs/index.html
      - docs/cosmos-explorer-v085-final-no-sirius.html
      - docs/cosmos-sun-v207.js
      - docs/cosmos-black-hole-radiance-v013.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright@1.58.0
      - name: Validate the deployed five-stop tour
        shell: bash
        run: |
          export COSMOS_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          node tools/cosmos-sun-v207-smoke.cjs \
            --url "https://thepatientagent.github.io/GPT-6-PAgt/?qa=${GITHUB_SHA}" \
            --output cosmos-sun-live-qa
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-sun-live-qa
          path: cosmos-sun-live-qa
          if-no-files-found: ignore
