name: COSMOS X optimized video
on:
  push:
    paths:
      - .github/workflows/cosmos-x-optimized-video.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Encode COSMOS tour with persistent diagnostic report
        shell: bash
        run: |
          set -uo pipefail
          src=docs/media/cosmos-real-tour-live-60fps.mp4
          output=docs/media/cosmos-real-tour-x-optimized-60fps.mp4
          report=docs/media/cosmos-x-optimized-status.txt
          mkdir -p docs/media
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "source=$src"
            echo "target=$output"
            echo "date_utc=$(date -u +%FT%TZ)"
          } > "$report"
          status=0
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo 'ERROR: ffmpeg/ffprobe unavailable' >> "$report"
            status=10
          elif [ ! -s "$src" ]; then
            echo 'ERROR: input MP4 missing or empty' >> "$report"
            status=11
          else
            echo 'SOURCE METADATA:' >> "$report"
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 "$src" >> "$report" 2>&1 || true
            ffmpeg -nostdin -y -hide_banner -loglevel warning -i "$src" -map 0:v:0 -an -vf "fps=60,scale=720:1280:flags=lanczos,format=yuv420p" -c:v libx264 -threads 2 -preset veryfast -profile:v high -level:v 4.2 -b:v 3000k -maxrate 3500k -bufsize 7000k -g 120 -movflags +faststart "$output" > /tmp/cosmos-encode.log 2>&1 || status=$?
            if [ "$status" -eq 0 ] && [ -s "$output" ]; then
              echo 'RESULT=SUCCESS' >> "$report"
              ffprobe -v error -show_entries format=duration,size:stream=codec_name,profile,width,height,r_frame_rate -of default=noprint_wrappers=1 "$output" >> "$report" 2>&1 || true
            else
              echo "RESULT=FAILURE encode_exit_code=$status" >> "$report"
              tail -n 50 /tmp/cosmos-encode.log >> "$report" 2>/dev/null || true
            fi
          fi
          echo "RESULT_CODE=$status" >> "$report"
          cat "$report"
      - name: Publish video and diagnostics even after encoding error
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/cosmos-x-optimized-status.txt
          if [ -s docs/media/cosmos-real-tour-x-optimized-60fps.mp4 ]; then
            git add docs/media/cosmos-real-tour-x-optimized-60fps.mp4
          fi
          git commit -m "Report COSMOS X encode result and publish optimized video" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
