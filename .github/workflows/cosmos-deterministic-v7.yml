name: COSMOS deterministic native 60fps video V7
on:
  push:
    branches: [main]
    paths: [.github/workflows/cosmos-deterministic-v7.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture tools
        run: |
          python -m pip install playwright==1.58.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Capture every animation frame with a controlled simulation clock
        run: |
          mkdir -p /tmp/cosmos-v7-frames docs/media
          python - <<'PY'
          from datetime import datetime, timedelta
          import os, time
          from playwright.sync_api import sync_playwright

          source='https://thepatientagent.github.io/GPT-6-PAgt/?capture=cosmos-v7'
          frames_dir='/tmp/cosmos-v7-frames'
          fps=60
          max_frames=3900
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=[
                  '--no-sandbox','--disable-dev-shm-usage',
                  '--enable-webgl','--use-gl=angle','--use-angle=swiftshader'
              ])
              context=browser.new_context(viewport={'width':360,'height':640},
                  device_scale_factor=1,is_mobile=True,has_touch=True,
                  reduced_motion='no-preference')
              page=context.new_page()
              # Install a consistent clock BEFORE navigation. Changing the clock
              # after the tour begins otherwise jumps performance.now() forward.
              page.clock.install()
              page.on('pageerror',lambda e: print('PAGE ERROR:',str(e)[:300],flush=True))
              page.goto(source,wait_until='domcontentloaded',timeout=90000)
              inner=page.frame_locator('#cosmos')
              inner.locator('body.touring').wait_for(state='attached',timeout=60000)
              inner.locator('#tourStep').wait_for(state='visible',timeout=30000)
              print('TOUR LOADED:',inner.locator('#tourStep').inner_text(),flush=True)
              # The first captured frame is already IN the guided tour.
              # No landing-page footage is ever recorded or trimmed afterward.
              page.clock.pause_at(datetime.now()+timedelta(seconds=2))
              stage_names=[]
              finished_since=None
              elapsed_ms=0
              css_sync=r"""(elapsed) => {
                if (!window.__cosmosCaptureCSS) window.__cosmosCaptureCSS=new WeakMap();
                const records=window.__cosmosCaptureCSS;
                const docs=[];
                function walk(doc) {
                  if (!doc) return;
                  docs.push(doc);
                  for (const frame of doc.querySelectorAll('iframe')) {
                    try { if (frame.contentDocument) walk(frame.contentDocument); } catch(e){}
                  }
                }
                walk(document);
                for (const doc of docs) {
                  for (const animation of doc.getAnimations({subtree:true})) {
                    if (animation.playState !== 'running') continue;
                    let state=records.get(animation);
                    if (!state) {
                      state={start:elapsed,base:Number(animation.currentTime)||0};
                      records.set(animation,state);
                    }
                    try {animation.currentTime=state.base+(elapsed-state.start);} catch(e){}
                  }
                }
              }"""
              for i in range(max_frames):
                  if i:
                      # Repeating 16, 17, 17 milliseconds averages exactly 60fps.
                      step=(16 if i%3==1 else 17)
                      page.clock.run_for(step)
                      elapsed_ms+=step
                  page.evaluate(css_sync,elapsed_ms)
                  page.screenshot(path=f'{frames_dir}/frame-{i:05d}.png',
                      animations='allow',timeout=60000)
                  if i%30==0:
                      frame=page.frame(name='cosmos')
                      info=page.evaluate("""() => {
                        const d=document.getElementById('cosmos')?.contentDocument;
                        return d ? {stage:d.getElementById('tourStep')?.textContent||'',
                          name:d.getElementById('tourName')?.textContent||'',
                          touring:d.body.classList.contains('touring')} : null
                      }""")
                      if info:
                          label=info['stage'].strip()+' '+info['name'].strip()
                          if not stage_names or label!=stage_names[-1]:
                              stage_names.append(label)
                              print('FRAME',i,'TOUR:',label,flush=True)
                          if len(stage_names)>=5 and not info['touring']:
                              finished_since=i if finished_since is None else finished_since
                      if i%300==0:print('FRAME PROGRESS',i,'elapsed',round(elapsed_ms/1000,2),'s',flush=True)
                  if finished_since is not None and i-finished_since>=30:break
              print('CAPTURED',i+1,'frames',flush=True)
              print('STOPS',stage_names,flush=True)
              assert len(stage_names)>=5,'Full five-stop guided tour not observed'
              with open('/tmp/cosmos-v7-frames/count.txt','w') as f:f.write(str(i+1))
              context.close()
              browser.close()
          PY
      - name: Encode constant-rate 60fps H264 video
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 60 \
            -i /tmp/cosmos-v7-frames/frame-%05d.png \
            -vf "scale=720:1280:flags=lanczos,format=yuv420p" \
            -c:v libx264 -preset medium -crf 18 -r 60 \
            -movflags +faststart -an \
            docs/media/cosmos-final-five-stop-tour-native-60fps-v7.mp4
          ffprobe -v error -show_entries stream=r_frame_rate,nb_frames:format=duration,size \
            -of default=noprint_wrappers=1 \
            docs/media/cosmos-final-five-stop-tour-native-60fps-v7.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-native-60fps-v7
          path: docs/media/cosmos-final-five-stop-tour-native-60fps-v7.mp4
      - name: Publish video without modifying existing releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/cosmos-final-five-stop-tour-native-60fps-v7.mp4
          git commit -m "Publish native 60fps frame-accurate COSMOS tour V7"
          git push
